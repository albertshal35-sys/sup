<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridiron Moneyball</title>
<style>
/* ============================================================ tokens
   Light is the base palette; dark redefines only the tokens, guarded so an
   explicit choice beats the OS setting in both directions. */
:root {
  --ground:      #E7ECE9;
  --surface:     #FBFDFC;
  --surface-2:   #F1F5F3;
  --line:        #D2DBD7;
  --line-soft:   #E1E8E5;
  --ink:         #0C1A17;
  --ink-2:       #3A4B45;
  --muted:       #64756E;
  --accent:      #0E7C6C;
  --accent-soft: #D6EBE6;
  --gold:        #B8801B;
  --gold-soft:   #F4E7C9;
  --danger:      #A8402A;
  --danger-soft: #F2DDD7;
  --qb:   #0E7C6C;
  --rb:   #A8532A;
  --wr:   #2C5D9B;
  --te:   #7A4C9E;
  --k:    #6B7A73;
  --dst:  #4A6350;
  --shadow: 0 1px 2px rgba(12,26,23,.05), 0 8px 24px -12px rgba(12,26,23,.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:      #0A1311;
    --surface:     #111D1A;
    --surface-2:   #16241F;
    --line:        #263531;
    --line-soft:   #1C2A26;
    --ink:         #E3EBE7;
    --ink-2:       #B4C3BD;
    --muted:       #7E8F88;
    --accent:      #46C4AC;
    --accent-soft: #10312C;
    --gold:        #E5B455;
    --gold-soft:   #33280F;
    --danger:      #E4816B;
    --danger-soft: #3A1D16;
    --qb:   #46C4AC;
    --rb:   #E09468;
    --wr:   #74A8E8;
    --te:   #BC96DF;
    --k:    #9AAAA3;
    --dst:  #86AD8F;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] {
  --ground:      #0A1311;
  --surface:     #111D1A;
  --surface-2:   #16241F;
  --line:        #263531;
  --line-soft:   #1C2A26;
  --ink:         #E3EBE7;
  --ink-2:       #B4C3BD;
  --muted:       #7E8F88;
  --accent:      #46C4AC;
  --accent-soft: #10312C;
  --gold:        #E5B455;
  --gold-soft:   #33280F;
  --danger:      #E4816B;
  --danger-soft: #3A1D16;
  --qb:   #46C4AC;
  --rb:   #E09468;
  --wr:   #74A8E8;
  --te:   #BC96DF;
  --k:    #9AAAA3;
  --dst:  #86AD8F;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.mono, td.num, .num {
  font-family: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums;
}
h1, h2, h3 { text-wrap: balance; margin: 0; letter-spacing: -0.022em; font-weight: 700; }
h1 { font-size: clamp(1.5rem, 1.1rem + 1.6vw, 2.1rem); }
h2 { font-size: 1.18rem; }
h3 { font-size: 0.95rem; }
p { margin: 0 0 .75rem; }
a { color: var(--accent); }
.eyebrow {
  font-size: .68rem; text-transform: uppercase; letter-spacing: .14em;
  font-weight: 700; color: var(--muted);
}

/* ============================================================ chrome */
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 clamp(.75rem, 2vw, 1.5rem) 4rem; }
header.top {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar {
  max-width: 1440px; margin: 0 auto; padding: .7rem clamp(.75rem, 2vw, 1.5rem);
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
}
.brand { display: flex; align-items: baseline; gap: .55rem; margin-right: auto; }
.brand .name { font-weight: 800; letter-spacing: -.03em; font-size: 1.05rem; }
.brand .sub { font-size: .7rem; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
.tabs { display: flex; gap: .25rem; background: var(--surface-2); padding: .25rem; border-radius: 9px; border: 1px solid var(--line-soft); }
.tabs button {
  font: inherit; font-weight: 650; font-size: .85rem; border: 0; cursor: pointer;
  padding: .4rem .85rem; border-radius: 6px; background: transparent; color: var(--muted);
}
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tabs button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.ghost {
  font: inherit; font-size: .8rem; font-weight: 600; cursor: pointer;
  background: var(--surface); color: var(--ink-2);
  border: 1px solid var(--line); border-radius: 7px; padding: .35rem .7rem;
}
.ghost:hover { border-color: var(--accent); color: var(--accent); }

/* ============================================================ generic */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow);
}
.pad { padding: 1rem 1.1rem; }
.grid { display: grid; gap: 1rem; }
.section-head { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; margin-bottom: .6rem; }
.hint { font-size: .8rem; color: var(--muted); }

.pos-pill {
  display: inline-block; min-width: 2.4em; text-align: center;
  font-size: .68rem; font-weight: 800; letter-spacing: .04em;
  padding: .12rem .34rem; border-radius: 4px; color: #fff;
}
.pos-QB { background: var(--qb); } .pos-RB { background: var(--rb); }
.pos-WR { background: var(--wr); } .pos-TE { background: var(--te); }
.pos-K  { background: var(--k); }  .pos-DST { background: var(--dst); }

.flag {
  display: inline-block; font-size: .66rem; font-weight: 650; padding: .08rem .34rem;
  border-radius: 4px; margin-right: .25rem; white-space: nowrap;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--line-soft);
}
.flag.warn   { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.flag.good   { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.flag.gold   { background: var(--gold-soft);   color: var(--gold);   border-color: transparent; }

/* ============================================================ table */
.tablewrap { overflow-x: auto; border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: .86rem; }
thead th {
  position: sticky; top: 56px; z-index: 5;
  background: var(--surface-2); color: var(--muted);
  font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700;
  text-align: right; padding: .5rem .55rem; white-space: nowrap;
  border-bottom: 1px solid var(--line); cursor: pointer; user-select: none;
}
thead th:first-child, thead th.l { text-align: left; }
/* short reference tables are read in place, not scrolled past — a header pinned to
   the viewport detaches from its own rows */
table.plain thead th { position: static; cursor: default; }
/* the player grid scrolls inside its own box, so its header pins to that box and
   the name column pins to the left edge rather than to the page */
table.grid-t { font-size: .8rem; }
table.grid-t thead th { top: 0; z-index: 6; }
table.grid-t th.stick, table.grid-t td.stick {
  position: sticky; left: 0; z-index: 4; background: var(--surface);
  border-right: 1px solid var(--line); min-width: 15rem;
}
table.grid-t thead th.stick { z-index: 7; background: var(--surface-2); }
table.grid-t tbody td { padding: .3rem .5rem; border-bottom: 1px solid var(--line-soft); }
table.grid-t tbody tr:hover td.stick { background: var(--surface-2); }
table.grid-t .pname { margin: 0 .35rem 0 .4rem; }
thead th[aria-sort]:not([aria-sort="none"]) { color: var(--accent); }
tbody td { padding: .42rem .55rem; text-align: right; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
tbody td.l { text-align: left; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.gone { opacity: .38; }
tbody tr.mine { background: color-mix(in srgb, var(--accent-soft) 60%, transparent); }
.tier-stripe { display: inline-block; width: 3px; height: 1.1em; border-radius: 2px; vertical-align: -.2em; margin-right: .45rem; }
.pname { font-weight: 620; }
.psub { font-size: .72rem; color: var(--muted); font-weight: 500; }

.vbar { display: inline-block; height: 6px; border-radius: 3px; background: var(--accent); opacity: .8; vertical-align: middle; }

/* ============================================================ draft room */
.room { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr) minmax(0,.95fr); gap: 1rem; align-items: start; }
@media (max-width: 1100px) { .room { grid-template-columns: 1fr; } }
.statline { display: flex; gap: 1.4rem; flex-wrap: wrap; align-items: baseline; }
.stat .k { font-size: .66rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.stat .v { font-size: 1.35rem; font-weight: 750; letter-spacing: -.02em; }
.stat .v.sm { font-size: 1rem; }

.rec { display: flex; gap: .7rem; align-items: flex-start; padding: .6rem .7rem; border-radius: 9px; border: 1px solid var(--line-soft); }
.rec + .rec { margin-top: .45rem; }
.rec.top { border-color: var(--accent); background: var(--accent-soft); }
.rec .n { font-weight: 800; color: var(--muted); font-size: .8rem; min-width: 1.1em; }
.rec .body { flex: 1; min-width: 0; }
.rec .why { font-size: .76rem; color: var(--ink-2); margin-top: .12rem; }
.rec .act { display: flex; gap: .3rem; }
.mini {
  font: inherit; font-size: .7rem; font-weight: 700; cursor: pointer; border-radius: 6px;
  padding: .22rem .45rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
}
.mini.pick { background: var(--accent); border-color: var(--accent); color: #fff; }
.mini:hover { filter: brightness(1.06); }

.slots { display: grid; gap: .28rem; }
.slot { display: flex; align-items: center; gap: .5rem; font-size: .82rem; padding: .28rem .45rem; border-radius: 6px; background: var(--surface-2); }
.slot .lab { font-size: .66rem; font-weight: 800; letter-spacing: .06em; color: var(--muted); min-width: 3.2em; }
.slot.empty { border: 1px dashed var(--line); background: transparent; color: var(--muted); }

.search { display: flex; gap: .4rem; }
.search input {
  flex: 1; min-width: 0; font: inherit; font-size: .9rem; padding: .45rem .6rem;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
select.cfg { font: inherit; font-size: .8rem; padding: .3rem .45rem; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
label.cfg { font-size: .72rem; color: var(--muted); font-weight: 650; display: inline-flex; gap: .35rem; align-items: center; }

.log { max-height: 260px; overflow-y: auto; font-size: .78rem; }
.log div { display: flex; gap: .5rem; padding: .18rem 0; border-bottom: 1px solid var(--line-soft); }
.log .pk { color: var(--muted); min-width: 3.4em; }

.chips { display: flex; gap: .3rem; flex-wrap: wrap; }
.chip {
  font: inherit; font-size: .74rem; font-weight: 700; cursor: pointer; padding: .25rem .6rem;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* ============================================================ findings */
.findings { display: grid; gap: 1.4rem 1.6rem; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); align-items: start; }
.finding { border-top: 2px solid var(--line); padding-top: .7rem; }
.finding h3 { margin-bottom: .3rem; }
.finding p { font-size: .84rem; color: var(--ink-2); margin-bottom: .4rem; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: .1rem .6rem; font-size: .8rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; }
.bignum { font-size: 2rem; font-weight: 780; letter-spacing: -.03em; line-height: 1; }
.bignum.good { color: var(--accent); } .bignum.bad { color: var(--danger); }
figure { margin: 0; }
figcaption { font-size: .74rem; color: var(--muted); margin-top: .4rem; }
svg text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

details.method { margin-top: 1rem; }
details.method summary { cursor: pointer; font-weight: 650; font-size: .88rem; padding: .4rem 0; }
details.method .pad { font-size: .84rem; color: var(--ink-2); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<div class="wrap">

</div>

const byId = new Map(DATA.players.map(p => [p.id, p]));
const soldIds = () => new Set(S.sales.map(s => s.id));
const available = () => { const t = soldIds(); return DATA.players.filter(p => !t.has(p.id)); };

/* ==================================================================
   AUCTION MATH

   Every dollar in the room is chasing the value still on the board. When the
   early lots go cheap, the leftover money has to land somewhere, so the price
   of everyone still available rises. That ratio is the inflation factor, and
   it is the single most useful number in a live auction.
   ================================================================== */
function myRoster() { return S.sales.filter(s => s.mine).map(s => byId.get(s.id)).filter(Boolean); }
function mySpent() { return S.sales.filter(s => s.mine).reduce((a, s) => a + s.price, 0); }

function budgetState() {
  const roster = myRoster();
  const spent = mySpent();
  const left = S.budget - spent;
  const spots = ROSTER_SIZE - roster.length;
  return {
    roster, spent, left, spots,
    maxBid: Math.max(0, left - Math.max(0, spots - 1)),
    perSpot: spots > 0 ? left / spots : 0
  };
}

function leagueState() {
  const totalMoney = S.teams * S.budget;
  const spentAll = S.sales.reduce((a, s) => a + s.price, 0);
  const moneyLeft = totalMoney - spentAll;
  const spotsLeft = S.teams * ROSTER_SIZE - S.sales.length;
  const discretionary = Math.max(0, moneyLeft - spotsLeft);   // $1 reserved per spot
  // value still on the board, counted over as many players as there are seats
  const av = available().slice().sort((a, b) => b.auc - a.auc).slice(0, Math.max(0, spotsLeft));
  const valueLeft = av.reduce((a, p) => a + Math.max(0, p.auc - 1), 0);
  const inflation = valueLeft > 0 ? discretionary / valueLeft : 1;
  return { totalMoney, spentAll, moneyLeft, spotsLeft, discretionary, valueLeft,
           inflation: Math.max(0.3, Math.min(3, inflation)) };
}

/* What this room is doing to each position, versus the board.

   A fixed rule cannot know your league. A premium that pays when two managers
   use it stops paying when six do, so the only durable version of "buy low" is
   measured live: track what each position has actually sold for against list,
   and lean toward whatever is going cheap. */
function posMarket(pos, L) {
  L = L || leagueState();
  let paid = 0, list = 0, n = 0;
  S.sales.forEach(s => {
    const p = byId.get(s.id);
    if (!p || p.pos !== pos) return;
    paid += s.price; list += Math.max(1, p.auc); n++;
  });
  const live = (n > 0 && list > 0) ? paid / list : null;

  // Your own league's 2025 sheet is a far better starting guess than "assume the
  // room is rational". Shrink from that prior toward what is happening tonight as
  // the sales pile up — eight sales at a position and the live read has the floor.
  const prior = (RESEARCH.room && RESEARCH.room.ratio) ? RESEARCH.room.ratio[pos] : null;
  let ratio;
  if (live == null) ratio = prior;
  else if (prior == null) ratio = live;
  else { const w = n / (n + 8); ratio = w * live + (1 - w) * prior; }
  if (ratio == null) return { n, ratio: null, live, prior, lean: 1 };

  // lean the other way, gently, and never by more than 15%
  const lean = Math.max(0.85, Math.min(1.15, 1 + (1 - ratio) * 0.5));
  return { n, ratio, live, prior, lean };
}

/* Market price after inflation — what this player should go for right now. */
function adjPrice(p, L) {
  return Math.max(1, Math.round(1 + Math.max(0, p.auc - 1) * (L || leagueState()).inflation));
}

/* Roster slots still open, flex included. */
function openSlots(players) {
  const c = { QB: 0, RB: 0, WR: 0, TE: 0, K: 0, DST: 0 };
  players.forEach(p => { if (c[p.pos] != null) c[p.pos]++; });
  const need = {};
  ["QB", "RB", "WR", "TE", "K", "DST"].forEach(p => need[p] = Math.max(0, LINEUP[p] - c[p]));
  let surplus = 0;
  FLEX_POS.forEach(p => surplus += Math.max(0, c[p] - LINEUP[p]));
  need.FLEX = Math.max(0, LINEUP.FLEX - surplus);
  need._counts = c;
  return need;
}

/* What YOU should be willing to pay. Two forces: the market price after
   inflation, and your own budget pressure — money you do not spend is money
   you never had. */
function myMax(p, B, L) {
  B = B || budgetState(); L = L || leagueState();
  if (B.spots <= 0) return 0;
  const need = openSlots(B.roster);
  if ((need._counts[p.pos] || 0) >= (CAPS[p.pos] || 99)) return 0;

  const market = adjPrice(p, L);
  // my own money-to-value ratio over the seats I still have to fill
  const myDisc = Math.max(0, B.left - B.spots);
  const wants = available().filter(q => q.id !== p.id)
    .sort((a, b) => b.auc - a.auc).slice(0, Math.max(0, B.spots - 1));
  const wantValue = wants.reduce((a, q) => a + Math.max(0, q.auc - 1), 0)
                  + Math.max(0, p.auc - 1);
  const personal = wantValue > 0 ? myDisc / wantValue : 1;

  let bid = 1 + Math.max(0, p.auc - 1) * Math.max(L.inflation, personal);

  // No fixed positional premium. Every one tested — quarterback, receiver,
  // volatility — either lost outright against ordinary value bidders or only
  // paid while few others were doing it. What replaces it is the live read on
  // what THIS room is actually underpaying for.
  bid *= posMarket(p.pos, L).lean;

  // a slot you still have to fill is worth more than a bench upgrade
  const fills = need[p.pos] > 0 || (need.FLEX > 0 && FLEX_POS.includes(p.pos));
  if (fills) bid *= 1.08;
  else if (p.pos !== "K" && p.pos !== "DST") bid *= 0.92;

  // kicker and defense are coin flips; never pay for them
  if (p.pos === "K" || p.pos === "DST") bid = Math.min(bid, 2);

  // Never bid money — or a roster spot — you need to finish a legal lineup.
  // K and D/ST are mandatory slots even though they are worth a dollar each.
  const mustFill = Object.entries(need).filter(([k]) => k !== "_counts" && k !== "FLEX")
    .reduce((a, [, v]) => a + v, 0) + need.FLEX;
  const fillsAny = fills || need[p.pos] > 0;
  if (!fillsAny && mustFill >= B.spots) return 0;
  const reserve = Math.max(0, mustFill - (fillsAny ? 1 : 0));
  return Math.max(0, Math.min(Math.round(bid), B.maxBid, B.left - reserve));
}

function verdict(p, B, L) {
  const mx = myMax(p, B, L);
  const mkt = adjPrice(p, L);
  const need = openSlots(B.roster);
  if (B.spots <= 0) return { mx, mkt, tone: "warn", text: "Your roster is full." };
  if ((need._counts[p.pos] || 0) >= (CAPS[p.pos] || 99))
    return { mx, mkt, tone: "warn", text: "You already have as many " + p.pos + "s as you can use." };
  if (mx < 1) return { mx, mkt, tone: "warn", text: "You cannot afford him and still fill your roster." };
  if (mx >= mkt) return { mx, mkt, tone: "good",
    text: "Bid to $" + mx + ". Market is about $" + mkt + ", and you can afford to win this one." };
  return { mx, mkt, tone: "", text: "Bid to $" + mx + " and no further — he should go for about $" + mkt + "." };
}

/* The board, re-sorted by what is worth chasing given your budget right now. */
function targets(limit) {
  const B = budgetState(), L = leagueState();
  const need = openSlots(B.roster);
  // once your remaining spots only just cover the slots you must still fill,
  // kicker and defense stop being ignorable and start being the whole list
  const mustFill = Object.entries(need).filter(([k]) => k !== "_counts" && k !== "FLEX")
    .reduce((a, [, v]) => a + v, 0) + need.FLEX;
  const mustOnly = mustFill >= B.spots;
  return available().map(p => {
    const mx = myMax(p, B, L);
    const mkt = adjPrice(p, L);
    const fills = need[p.pos] > 0 || (need.FLEX > 0 && FLEX_POS.includes(p.pos));
    const why = [];
    if (fills) why.push("fills your " + (need[p.pos] > 0 ? p.pos : "flex") + " slot");
    if (mx > mkt) why.push("you can outbid the room's likely price of $" + mkt);
    if (p.flags && p.flags.includes("TD regression risk")) why.push("scored above his volume last year — expect a pullback");
    if (p.flags && p.flags.includes("Positive TD regression")) why.push("underscored his volume last year — buy-low");
    // value per dollar you can actually spend, weighted toward slots you need
    const score = mx < 1 ? -1 : (p.vorp + (fills ? 25 : 0)) / Math.max(mkt, 1);
    return { p, mx, mkt, why, score, affordable: mx >= mkt };
  }).filter(x => x.score > 0 && (mustOnly || (x.p.pos !== "K" && x.p.pos !== "DST")))
    .sort((a, b) => b.score - a.score)
    // no more than two of any position, or a 2QB league returns nothing but
    // quarterbacks and the list stops being a shopping list
    .filter((x, _i, all) => all.filter(y => y.p.pos === x.p.pos).indexOf(x) < 2)
    .slice(0, limit || 8);
}

function priceCheck() {
  /* How the room has been paying versus the board, so far. */
  if (!S.sales.length) return null;
  let paid = 0, list = 0;
  S.sales.forEach(s => { const p = byId.get(s.id); if (p) { paid += s.price; list += Math.max(1, p.auc); } });
  return list > 0 ? paid / list : null;
}

}

    (S.boardFilter === "ALL" || p.pos === S.boardFilter) &&
    (!S.boardQuery || p.name.toLowerCase().includes(S.boardQuery.toLowerCase()) ||
      (p.team || "").toLowerCase().includes(S.boardQuery.toLowerCase())));
  const col = COLS.find(c => c.k === S.sortKey) || COLS.find(c => c.k === 'auc');
  rows.sort((a, b) => {
    const x = col.w(a), y = col.w(b);
    if (typeof x === "string" || typeof y === "string") return String(x).localeCompare(String(y)) * S.sortDir * -1;
    return ((x == null ? -1e9 : x) - (y == null ? -1e9 : y)) * S.sortDir;
  });
  const maxV = Math.max(...DATA.players.map(p => p.auc));

  el.innerHTML = `
  <div class="grid" style="padding-top:1.1rem">
    <div>
      <p class="eyebrow">The board</p>
      <h1>Every player, priced in dollars</h1>
      <p class="hint" style="max-width:70ch;margin-top:.4rem">
        Auction values for <strong>this</strong> lineup — 2QB, 2RB, 3WR, 1TE, 1 flex, full PPR, ${S.teams} teams at
        $${S.budget} each. A player's price is what he scores above <em>replacement</em> — the last man who
        actually starts somewhere, flex included — scaled so the room's whole budget is accounted for. The
        dollars on this page sum to the dollars in the league, and the ${DATA.players.filter(p => p.auc === 1).length} men with no surplus
        left cost a dollar, which is what they cost in a real room too.
        <strong>Value $</strong> is what he is worth; <strong>Expect $</strong> is what this room actually paid at
        his positional rank last year. The gap between them is the whole game — a quarterback worth $54 who goes
        for $42 is the trade, and a back worth $49 who goes for $60 is the one to let someone else make.
        Change the team count in the Auction Room and the ceilings follow, but the printed prices are built for
        a ${DATA.meta.teams}-team room.
        Projections come from gradient-boosted models trained on every player season from 1999 to 2025
        (${DATA.meta.player_seasons.toLocaleString()} of them), scored under your rules.
      </p>
    </div>

    <div class="card pad">
      <div class="section-head">
        <h2>What the data actually says</h2>
        <span class="hint">every number below is out of sample</span>
      </div>
      <div class="findings">${renderFindings()}</div>
      ${renderVorpChart()}
      <details class="method">
        <summary>The three columns you will not find on other boards</summary>
        <div class="pad" style="padding-left:0">
          <p><strong>Floor 25</strong> — the share of last season's seventeen weeks he outscored a typical starter
          at his position. How often he actually won you the slot, rather than how much he scored in total.</p>
          <p><strong>Spike 25</strong> — the share of weeks in the top decile of outcomes at his position. These
          are the weeks that beat a good opponent rather than a bad one.</p>
          <p><strong>Blank 25</strong> — the share of weeks he gave you nothing at all, injury and bye included.
          Per-game averages hide this; your lineup does not.</p>
          <p>All three are last season's actuals, not projections, and they describe rather than price. A player
          is priced on projected points, because that is what testing supported — see the note on Wins Above
          Available above. Use these to break ties between players the board has close together, and to know what
          you are buying: the same $30 can buy a metronome or a lottery ticket.</p>
        </div>
      </details>
      <details class="method">
        <summary>How the projections are built</summary>
        <div class="pad" style="padding-left:0">
          <p><strong>Data.</strong> nflverse play-by-play aggregates, 1999–2025: ${DATA.meta.player_seasons.toLocaleString()} scored
          player-seasons plus team defense and kicking. Targets and air yards only exist from 2009, so anything
          target-based trains on 2009+.</p>
          <p><strong>Projection.</strong> One gradient-boosted model per position predicts next-season points per game,
          a second predicts games played; season value is their product. Features are usage (carries, targets, target
          share, air-yards share, first downs), efficiency (EPA, CPOE, YAC, aDOT), age, experience, and two years of lags.
          The published number blends that model 75/25 with last season's actual points, which beat either alone in a
          15-season backtest.</p>
          <p><strong>Rookies</strong> get the historical average for their draft-capital bucket — no scouting, just what
          rookies taken in that range have actually done since 2006. <strong>Kickers and defenses</strong> are regressed
          most of the way to the league mean because that is all the year-over-year signal there is.</p>
          <p><strong>Value.</strong> Replacement level is computed by filling every starting slot in a 12-team league of
          this shape — including the flex — and reading off the first player who does not start. VORP is projected points
          above that line.</p>
          <p><strong>Honest limits.</strong> No injury reports, depth charts, holdouts, suspensions, or coaching changes
          are in here. A player who changed teams is projected on his old team's usage. Treat this as the price sheet,
          not the last word — if you know something the box score does not, override it.</p>
        </div>
      </details>
    </div>

    <div class="card">
      <div class="pad" style="display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)">
        <div class="chips">
          ${["ALL", "QB", "RB", "WR", "TE", "K", "DST"].map(p =>
            `<button class="chip" data-filter="${p}" aria-pressed="${S.boardFilter === p}">${p}</button>`).join("")}
        </div>
        <div class="search" style="flex:1;min-width:180px">
          <input id="boardSearch" type="search" placeholder="Search player or team" value="${S.boardQuery}">
        </div>
        <span class="hint">${rows.length} players</span>
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr>${COLS.map(c =>
            `<th class="${c.cls === 'l' ? 'l' : ''}" data-sort="${c.k}"
                 aria-sort="${S.sortKey === c.k ? (S.sortDir === -1 ? 'descending' : 'ascending') : 'none'}">${c.t}</th>`).join("")}
            <th class="l">Notes</th></tr></thead>
          <tbody>
            ${rows.slice(0, 400).map(p => `
              <tr class="${t.has(p.id) ? 'gone' : ''}">
                <td class="num">${p.rank}</td>
                <td class="l">
                  <span class="tier-stripe" style="background:var(--${p.pos.toLowerCase()})"></span>
                  <span class="pname">${p.name}</span>
                  <span class="psub"> ${p.pos}${p.posRank}</span>
                </td>
                <td class="l"><span class="pos-pill pos-${p.pos}">${p.pos}</span></td>
                <td class="l">${p.team || "—"}</td>
                <td class="num">${p.bye || "—"}</td>
                <td class="num">${fmt(p.age, 1)}</td>
                <td class="num">${fmt(p.ppg, 1)}</td>
                <td class="num">${fmt(p.g, 1)}</td>
                <td class="num">${fmt(p.pts)}</td>
                <td class="num">${fmt(p.vorp)}</td>
                <td class="num">${p.tier}</td>
                <td class="num" style="font-weight:${p.load != null && p.load >= 75 ? 700 : 400};${
                  p.load == null ? "" : p.load >= 75 ? "color:var(--accent)" : p.load <= 45 ? "color:var(--muted)" : ""}"
                  title="${p.load == null ? "" : `role worth ${fmt(p.role, 1)} touches a game, plus ${fmt(p.oppPrev, 1)} he actually got`}">${p.load == null ? "—" : fmt(p.load)}</td>
                <td class="num">${p.flr == null ? "—" : fmt(p.flr * 100) + "%"}</td>
                <td class="num">${p.spk == null ? "—" : fmt(p.spk * 100) + "%"}</td>
                <td class="num" style="${p.ghst != null && p.ghst > 0.2 ? "color:var(--danger)" : ""}">${p.ghst == null ? "—" : fmt(p.ghst * 100) + "%"}</td>
                <td class="num" style="font-weight:700">${p.auc > 0 ? "$" + p.auc : "—"}
                  <span class="vbar" style="width:${Math.max(0, p.auc / maxV * 44)}px"></span></td>
                <td class="num" style="color:var(--muted)"
                    title="What this room paid at his positional rank in 2025">${p.exp == null ? "—" : "$" + p.exp}</td>
                <td class="num" title="Value minus expected price. Positive means this room is likely to let him go cheap."
                    style="font-weight:${p.exp != null && Math.abs(p.auc - p.exp) >= 10 ? 700 : 400};${
                  p.exp == null ? "" : (p.auc - p.exp) >= 8 ? "color:var(--accent)"
                    : (p.auc - p.exp) <= -8 ? "color:var(--danger)" : ""}"
                  >${p.exp == null ? "—" : (p.auc - p.exp > 0 ? "+" : "") + (p.auc - p.exp)}</td>
                <td class="l">${(p.flags || []).map(f => `<span class="flag ${flagClass(f)}">${f}</span>`).join("")}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;

  el.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { S.boardFilter = b.dataset.filter; render(); });
  el.querySelectorAll("[data-sort]").forEach(th => th.onclick = () => {
    const k = th.dataset.sort;
    if (S.sortKey === k) S.sortDir *= -1; else { S.sortKey = k; S.sortDir = -1; }
    render();
  });
  const bs = $("#boardSearch");
  if (bs) bs.oninput = () => { S.boardQuery = bs.value; const p = bs.selectionStart; render(); const n = $("#boardSearch"); n.focus(); n.setSelectionRange(p, p); };
}

function flagClass(f) {
  if (/regression risk|cliff|decline|Injury/.test(f)) return "warn";
  if (/Positive/.test(f)) return "good";
  if (/Rookie/.test(f)) return "gold";
  return "";
}

function renderFindings() {
  const R = RESEARCH;
  return `
  <div class="finding">
    <p class="eyebrow">The 2QB rule is the whole game</p>
    <div class="bignum good">+${fmt(R.qb_edge)} pts</div>
    <p>Starting two quarterbacks drags replacement level from QB13 down to QB25. That single rule adds
    ${fmt(R.qb_edge)} points of value to the QB1 versus a one-quarterback league, and it is why roughly
    ${fmt(R.budget_split.QB)}% of your budget belongs at the position. Twenty-four quarterbacks start every

    ${fmt(Math.abs(R.td_regress.RB), 1)} and quarterbacks ${fmt(Math.abs(R.td_regress.QB), 1)}. Targets and

      <dt>Yards per carry</dt><dd class="num">${fmt(R.sticky.ypc, 2)}</dd>
      <dt>TD rate per touch</dt><dd class="num">${fmt(R.sticky.tdrate, 2)}</dd>
    </dl>

  <div class="finding">

    which is why durable players outrank flashier ones with thinner attendance records.</p>
    <dl class="kv">
      <dt>QB after a full season</dt><dd class="num">${fmt(R.games.QB, 1)} g</dd>
      <dt>RB after a full season</dt><dd class="num">${fmt(R.games.RB, 1)} g</dd>
      <dt>WR after a full season</dt><dd class="num">${fmt(R.games.WR, 1)} g</dd>

  <div class="finding">
    <p class="eyebrow">Kicker and defense are noise</p>
    <div class="bignum">${fmt(R.dst_k.dst_yoy, 2)} / ${fmt(R.dst_k.k_yoy, 2)}</div>
    <p>Year-over-year rank correlation for defenses and kickers. Both are close enough to a coin flip that
    every dollar past the first is a donation. The board prices them at a dollar or two, together about
    ${fmt(R.budget_split.K + R.budget_split.DST)}% of your budget, and the Auction Room caps your bid on them

  </div>

  <div class="finding">
    <p class="eyebrow">Your room, measured</p>
    <div class="bignum good">${fmt(R.room.ratio.QB * 100)}¢</div>
    <p>What your league paid on the dollar for quarterbacks in ${R.room.season}, against what they were worth

    ${fmt(R.room.room_pct.QB, 1)}% of its money on the position it has to start <strong>two</strong> of, when the
    board says ${fmt(R.room.fair_pct.QB, 1)}%. They are bidding a two-quarterback league as though it were a
    normal one, and paying for it at running back.</p>
    <p>This is the one place a positional lean is justified, because it is not a rule — it is a measurement of
    the nine people you are actually bidding against. The Auction Room starts from these numbers and shifts
    toward tonight's sales as they come in.</p>
    <dl class="kv">
      ${["QB", "TE", "WR", "RB"].map(pp => `<dt>${pp}</dt><dd class="num">${fmt(R.room.ratio[pp] * 100)}¢ on the dollar</dd>`).join("")}
    </dl>

  <div class="finding">

    <p>An earlier version of this page told you to pay 25% over list for quarterbacks. That was wrong, and the
    way it was wrong is the most useful thing here. It won its first tournament because it was competing against
    eleven <em>other</em> gimmick strategies. Re-run against ordinary value bidders, the edge decays to nothing
    as the room catches on: worth a little while you are one of two doing it, worth less than nothing once
    several are. Every fixed positional premium tested behaved the same way. They are trades against the room,
    not properties of the game, so the board ships neutral and reads the room instead.</p>
    <dl class="kv">
      ${R.field.qb_density.map(d => `<dt>${d.n} of ${DATA.meta.teams} pay up for QBs</dt>
        <dd class="num">${d.edge >= 0 ? "+" : ""}${fmt(d.edge, 1)} pp</dd>`).join("")}
    </dl>
  </div>

  <div class="finding">
    <p class="eyebrow">Edges decay as the room copies you</p>
    <div class="bignum">${R.field.vol_rare >= 0 ? "+" : ""}${fmt(R.field.vol_rare, 1)} → ${fmt(R.field.vol_common, 1)}</div>
    <p>Paying up for boom-bust players at equal projected points gained
    ${fmt(R.field.vol_rare, 1)} points of win rate when only ${R.field.n_rare} teams did it, and lost

    <dl class="kv">
      <dt>Chase volatility, ${R.field.n_rare} of ${R.field.teams} doing it</dt><dd class="num">${R.field.vol_rare >= 0 ? "+" : ""}${fmt(R.field.vol_rare, 1)} pp</dd>
      <dt>…half the room doing it</dt><dd class="num">${R.field.vol_half >= 0 ? "+" : ""}${fmt(R.field.vol_half, 1)} pp</dd>

  <div class="finding" style="border-top-color:var(--danger)">
    <p class="eyebrow" style="color:var(--danger)">Corrected — the price curve was too flat</p>

    <p>An earlier version of this board measured a player's surplus against the last man <em>bought</em> at his
    position rather than the last man who <em>starts</em>. That left almost every rostered player holding a big
    surplus, so the money spread evenly instead of concentrating, and the top of the board came out about 40%

    $${fmt(R.priceshape.err_old, 2)} a rank off; the corrected one is $${fmt(R.priceshape.err_new, 2)}.
    No exponent or fudge factor was involved — the replacement levels were already computed correctly, and the
    pricing simply was not using them.</p>
    <div class="tablewrap"><table class="plain">
      <thead><tr><th class="l">rank</th><th>this room</th><th>old</th><th>now</th></tr></thead>
      <tbody>${R.priceshape.curve.filter(c => [1, 10, 30, 50, 110].includes(c.rank)).map(c => `<tr>
        <td class="l">${c.rank}</td><td class="num">$${c.room}</td>
        <td class="num" style="color:var(--danger)">$${c.old}</td>
        <td class="num" style="color:var(--accent);font-weight:650">$${c.new}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="hint" style="margin-top:.4rem">Players priced at a dollar: this room ${R.priceshape.at1_room},
      old board ${R.priceshape.at1_old}, now ${R.priceshape.at1_new}.</p>
  </div>

  <div class="finding" style="border-top-color:var(--gold)">
    <p class="eyebrow" style="color:var(--gold)">Open question — the board may still ask too much for quarterbacks</p>
    <div class="bignum" style="color:var(--gold)">+${fmt(R.field.qbdisc[1], 1)} pp</div>
    <p>Two clean arms, one board, everything else held fixed. Teams that valued quarterbacks at
    <strong>80% of what this board says</strong> beat teams that paid the board — and they did it at
    <em>every</em> density tested. Paying a 25% premium lost at every density too.</p>
    <dl class="kv">
      <dt>Discount QBs, ${R.field.n_rare} of ${R.field.teams}</dt><dd class="num" style="color:var(--accent)">+${fmt(R.field.qbdisc[0], 1)} pp</dd>
      <dt>…half the room</dt><dd class="num" style="color:var(--accent)">+${fmt(R.field.qbdisc[1], 1)} pp</dd>
      <dt>…${R.field.n_common} of ${R.field.teams}</dt><dd class="num" style="color:var(--accent)">+${fmt(R.field.qbdisc[2], 1)} pp</dd>
      <dt>Premium on QBs, ${R.field.n_rare} of ${R.field.teams}</dt><dd class="num" style="color:var(--danger)">${fmt(R.field.qbprem[0], 1)} pp</dd>
      <dt>…${R.field.n_common} of ${R.field.teams}</dt><dd class="num" style="color:var(--danger)">${fmt(R.field.qbprem[2], 1)} pp</dd>
    </dl>
    <p style="margin-top:.5rem">That pattern is <em>not</em> a crowding trade. The volatility and floor tilts
    above flip sign as the room copies them; this one holds its sign whether two teams do it or eight. A tilt

    board's own quarterback valuation.</p>

    work this page has not done: the arm prices off raw projections without the spread correction, and the
    two-quarterback replacement level that makes QBs expensive is itself measured, not assumed. Until that is
    resolved, read the quarterback rows as a ceiling — and note the <strong>Expect $</strong> column already

    <p class="eyebrow" style="color:var(--danger)">Corrected — the model was too timid at the top</p>
    <div class="bignum">96 → 112</div>
    <p>A gradient-boosted model predicts a conditional <em>mean</em>. That is right for one player and wrong for a
    market: conditional means shrink toward the average, so the predicted spread comes out narrower than the real
    one. Across twelve seasons the projected QB1-minus-QB12 gap was 96 points where the realised gap is 121, and
    the symptom at an auction was a curve with no cliff — the board priced QB6 within a dollar or two of QB3 in a
    room that pays half as much for him.</p>
    <p>Each position's spread is now rescaled around its own replacement level, by a multiplier measured from
    history and validated leave-one-season-out. It cuts the error in points-per-rank at
    <em>every</em> position: QB +4.3, RB +4.1, WR +1.8, TE +0.8 points a rank.</p>
    <dl class="kv">
      <dt>QB spread ×</dt><dd class="num">1.17</dd>
      <dt>RB spread ×</dt><dd class="num">1.29</dd>

  </div>

  <div class="finding">
    <p class="eyebrow">A custom stat that failed honestly</p>
    <div class="bignum bad">${fmt(R.waa.diff, 1)} pp</div>
    <p><strong>Wins Above Available</strong> converts a player's every week into the probability it wins you that
    week, then sums the season. It forecasts realised wins better than projected points do
    (${fmt(R.waa.acc_waa, 3)} versus ${fmt(R.waa.acc_pts, 3)}, in all ten test seasons). Pricing an auction off it
    still lost ${fmt(Math.abs(R.waa.diff), 1)} points of win rate. The reason is worth keeping: your weekly score
    is a <em>sum</em>, and sums are linear, so a player's value to the team is simply his points. The win curve
    applies once, when your total meets an opponent's — applying it again to each player double-counts it. The
    stat still earns its place on the board as a read on floor and durability. It just must not set the price.</p>
    <dl class="kv">
      <dt>Forecasts wins better</dt><dd class="num">${fmt(R.waa.acc_waa, 3)} vs ${fmt(R.waa.acc_pts, 3)}</dd>
      <dt>Wins-priced team</dt><dd class="num">${fmt(R.waa.win_waa, 1)}%</dd>
      <dt>Points-priced team</dt><dd class="num">${fmt(R.waa.win_pts, 1)}%</dd>
    </dl>
  </div>

  <div class="finding">
    <p class="eyebrow">Stars and scrubs is a trap here</p>
    <div class="bignum bad">−${fmt(R.auction.stars_cost, 1)} pp</div>
    <p>Blowing the budget on five studs and filling the rest with dollar players was the worst strategy tested,
    ${fmt(R.auction.stars_cost, 1)} points of win rate below disciplined bidding. This lineup starts nine players
    and flexes a tenth; a roster with three stars and six holes loses more in the holes than it gains at the top.
    The winning teams spent about $${fmt(R.auction.best_spend)} of $200 and came out
    ${R.auction.best_shape.split("/").join(", ")}.</p>
    <dl class="kv">
      <dt>QB</dt><dd class="num">~${fmt(R.budget_split.QB)}% of your money</dd>
      <dt>RB</dt><dd class="num">~${fmt(R.budget_split.RB)}%</dd>

    </dl>
  </div>

  <div class="finding">
    <p class="eyebrow">Where the points are</p>
    <p>The shape of each position's value curve is the whole draft strategy. Quarterback is a cliff: QB1 through
    QB12 are worth more than the same ranks at running back, and then it falls off a table. Wide receiver is a
    gentle slope you can ride into the late rounds. Tight end is one elite player and then nothing.</p>
    <dl class="kv">
      <dt>QB12 value over replacement</dt><dd class="num">${fmt(R.curve.QB[11])}</dd>
      <dt>RB12</dt><dd class="num">${fmt(R.curve.RB[11])}</dd>
      <dt>WR12</dt><dd class="num">${fmt(R.curve.WR[11])}</dd>
      <dt>TE12</dt><dd class="num">${fmt(R.curve.TE[11])}</dd>
    </dl>
  </div>`;
}

function renderVorpChart() {
  const C = RESEARCH.curve, N = 36;
  const W = 720, H = 260, PL = 44, PR = 12, PT = 16, PB = 30;
  const all = ["QB", "RB", "WR", "TE"].flatMap(p => C[p].slice(0, N));
  const lo = Math.min(...all), hi = Math.max(...all);
  const x = i => PL + (i / (N - 1)) * (W - PL - PR);
  const y = v => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);
  const line = p => C[p].slice(0, N).map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const ticks = [0, 50, 100, 150, 200].filter(v => v >= lo && v <= hi);
  return `
  <figure style="margin-top:1.1rem">
    <div class="tablewrap">
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block" role="img"
           aria-label="Value over replacement by positional rank, 2015 to 2025 average">
        ${ticks.map(v => `<line x1="${PL}" x2="${W - PR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
          <text x="${PL - 8}" y="${y(v) + 4}" font-size="10" fill="var(--muted)" text-anchor="end">${v}</text>`).join("")}
        <line x1="${PL}" x2="${W - PR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/>
        ${[1, 6, 12, 18, 24, 30, 36].map(r => `<text x="${x(r - 1)}" y="${H - 10}" font-size="10" fill="var(--muted)" text-anchor="middle">${r}</text>`).join("")}
        ${["QB", "RB", "WR", "TE"].map(p =>
          `<path d="${line(p)}" fill="none" stroke="var(--${p.toLowerCase()})" stroke-width="2.4" stroke-linejoin="round"/>`).join("")}
        ${["QB", "RB", "WR", "TE"].map((p, i) =>
          `<g transform="translate(${W - PR - 190 + i * 48},${PT + 4})">
             <rect width="10" height="3" y="4" fill="var(--${p.toLowerCase()})"/>
             <text x="14" y="9" font-size="11" fill="var(--ink-2)">${p}</text></g>`).join("")}
      </svg>
    </div>
    <figcaption>Points above replacement by rank at each position, averaged 2015–2025 under this exact lineup.
      The dashed line is replacement level — below it, a player is free on waivers.</figcaption>
  </figure>`;
}

function renderRoster(B, need, L) {
  const used = new Set();
  const priceOf = id => { const s = S.sales.find(x => x.id === id && x.mine); return s ? s.price : 0; };
  const rows = [];
  const take = pos => {
    const c = B.roster.filter(p => p.pos === pos && !used.has(p.id)).sort((a, b) => b.pts - a.pts)[0];
    if (c) used.add(c.id);
    return c;
  };
  const push = (lab, p) => rows.push(`<div class="slot ${p ? "" : "empty"}">
      <span class="lab">${lab}</span>
      ${p ? `<span style="flex:1">${p.name} <span class="psub">${p.team || ""}${p.bye ? " · bye " + p.bye : ""}</span></span>
             <span class="mono psub">$${priceOf(p.id)}</span>`
          : `<span style="flex:1">— open —</span>`}
    </div>`);
  for (let i = 0; i < LINEUP.QB; i++) push("QB", take("QB"));
  for (let i = 0; i < LINEUP.RB; i++) push("RB", take("RB"));
  for (let i = 0; i < LINEUP.WR; i++) push("WR", take("WR"));
  push("TE", take("TE"));
  const flex = B.roster.filter(p => FLEX_POS.includes(p.pos) && !used.has(p.id)).sort((a, b) => b.pts - a.pts)[0];
  if (flex) used.add(flex.id);
  push("FLEX", flex);
  push("DST", take("DST"));
  push("K", take("K"));
  const bench = B.roster.filter(p => !used.has(p.id)).sort((a, b) => b.pts - a.pts);
  const starters = B.roster.filter(p => used.has(p.id));
  const projPts = starters.reduce((a, p) => a + p.pts, 0);

  // where the money went, against where the board says it should go
  const spentBy = {};
  S.sales.filter(x => x.mine).forEach(x => {
    const p = byId.get(x.id); if (p) spentBy[p.pos] = (spentBy[p.pos] || 0) + x.price;
  });
  const target = RESEARCH.budget_split || {};

  const byes = {};
  starters.forEach(p => { if (p.bye) (byes[p.bye] = byes[p.bye] || []).push(p); });
  const clashes = Object.entries(byes).filter(([, v]) => v.length >= 3);

  const pct = B.spent / S.budget * 100;
  return `
    <div class="slots">${rows.join("")}</div>
    <div style="margin-top:.9rem">
      <div style="height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden">
        <div style="height:100%;width:${Math.min(100, pct)}%;background:var(--accent)"></div>
      </div>
      <p class="hint" style="margin:.3rem 0 0">$${fmt(B.spent)} of $${fmt(S.budget)} spent · ${B.roster.length}/${ROSTER_SIZE} rostered</p>
    </div>
    <div style="margin-top:.7rem;display:flex;gap:1.2rem;flex-wrap:wrap">
      <div class="stat"><div class="k">Projected starter points</div><div class="v mono sm">${fmt(projPts)}</div></div>
      <div class="stat"><div class="k">Slots open</div>
        <div class="v mono sm">${Object.entries(need).filter(([k]) => k !== "_counts").reduce((a, [, v]) => a + v, 0)}</div></div>
    </div>
    ${Object.keys(spentBy).length ? `
      <div style="margin-top:.8rem">
        <p class="eyebrow" style="margin-bottom:.35rem">Where your money went</p>
        <dl class="kv">${["QB", "RB", "WR", "TE"].filter(p => spentBy[p] || target[p]).map(p =>
          `<dt>${p}</dt><dd class="num">$${fmt(spentBy[p] || 0)}${target[p] ? ` <span class="psub">of ~$${fmt(target[p] / 100 * S.budget)}</span>` : ""}</dd>`).join("")}</dl>
      </div>` : ""}
    ${clashes.length ? `<p class="hint" style="margin-top:.6rem"><span class="flag warn">Bye stack</span>
      ${clashes.map(([w, v]) => `${v.length} starters off in week ${w}`).join("; ")}.</p>` : ""}
    ${bench.length ? `<div style="margin-top:.9rem">
      <p class="eyebrow" style="margin-bottom:.35rem">Bench (${bench.length}/${BENCH})</p>
      <div class="slots">${bench.map(p => `<div class="slot">
        <span class="lab">${p.pos}</span><span style="flex:1">${p.name}</span>
        <span class="mono psub">$${priceOf(p.id)}</span></div>`).join("")}</div></div>` : ""}`;
}

function matchPlayers(q) {
  q = (q || "").trim().toLowerCase();
  if (!q) return [];
  return available().filter(p => p.name.toLowerCase().includes(q)).slice(0, 6);
}

function wireLog() {
  const inp = $("#logSearch"), price = $("#logPrice"), box = $("#logResult");
  if (!inp) return;
  const paint = () => {
    const m = matchPlayers(inp.value);
    box.innerHTML = m.length ? m.map(p => `
      <div class="rec">
        <div class="body"><div><span class="pos-pill pos-${p.pos}">${p.pos}</span> <strong>${p.name}</strong>
          <span class="psub">${p.team || ""} · list $${p.auc}</span></div></div>
        <div class="act">
          <button class="mini pick" data-w="${p.id}">I won</button>
          <button class="mini" data-s="${p.id}">Sold</button>
        </div>
      </div>`).join("") : (inp.value.trim() ? `<p class="hint">Nobody left by that name.</p>` : "");
    const grab = id => {
      const v = +price.value;
      if (!v || v < 1) { price.focus(); return null; }
      return v;
    };
    box.querySelectorAll("[data-w]").forEach(b => b.onclick = () => {
      const v = grab(); if (v) { logSale(b.dataset.w, v, true); }
    });
    box.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
      const v = grab(); if (v) { logSale(b.dataset.s, v, false); }
    });
  };
  inp.oninput = paint;
  inp.onkeydown = e => {
    if (e.key !== "Enter") return;
    const m = matchPlayers(inp.value);
    const v = +price.value;
    if (!m.length || !v || v < 1) return;
    e.preventDefault();
    logSale(m[0].id, v, e.shiftKey);

  paint();
}

/* ==================================================================

const HM = { cell: 21, gutL: 186, gutT: 150 };

function hmColor(r) {
  const a = Math.min(1, Math.abs(r)) * 100;
  return `color-mix(in srgb, var(--${r >= 0 ? "accent" : "danger"}) ${a.toFixed(1)}%, var(--surface))`;
}

function renderHeatmap() {
  const L = RESEARCH.corr.labels, M = RESEARCH.corr.matrix, n = L.length;
  const { cell, gutL, gutT } = HM;
  const W = gutL + n * cell + 8, H = gutT + n * cell + 8;
  const cells = [];
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const r = M[i][j];
      cells.push(`<rect data-i="${i}" data-j="${j}" x="${gutL + j * cell}" y="${gutT + i * cell}"
        width="${cell}" height="${cell}" fill="${i === j ? "var(--ink-2)" : hmColor(r)}"/>`);
    }
  }
  return `
  <figure style="margin:0">
    <div class="tablewrap" style="border:1px solid var(--line-soft);background:var(--surface)">
      <svg id="hmSvg" viewBox="0 0 ${W} ${H}" width="${W}" style="display:block;max-width:none"
           role="img" aria-label="Correlation matrix of ${n} fantasy football metrics, hierarchically clustered">
        ${cells.join("")}
        ${L.map((l, i) => `<text x="${gutL - 8}" y="${gutT + i * cell + cell / 2 + 4}" font-size="11.5"
          text-anchor="end" fill="var(--ink-2)">${l}</text>`).join("")}
        ${L.map((l, j) => `<text transform="translate(${gutL + j * cell + cell / 2 + 4},${gutT - 8}) rotate(-52)"
          font-size="11.5" text-anchor="start" fill="var(--ink-2)">${l}</text>`).join("")}
        <rect x="${gutL}" y="${gutT}" width="${n * cell}" height="${n * cell}"
              fill="none" stroke="var(--line)" stroke-width="1"/>
      </svg>
    </div>
    <div id="hmRead" class="mono" style="margin-top:.5rem;font-size:.8rem;color:var(--ink-2);min-height:1.3em">
      Hover any square to read the pair.
    </div>
    <figcaption>Spearman rank correlation between every pair of ${n} metrics, over
      ${RESEARCH.corr.n_rows || "12,000+"} player-seasons. Rows and columns are ordered by hierarchical
      clustering on 1&nbsp;&minus;&nbsp;|rho|, so metrics that say the same thing sit in blocks along the
      diagonal. Teal is positive, rust negative, intensity is strength.</figcaption>
  </figure>`;
}

/* ---------------------------------------------------------------- player grid */
function gridCell(z, flip) {
  if (z == null) return "transparent";
  const v = flip ? -z : z;
  return `color-mix(in srgb, var(--${v >= 0 ? "accent" : "danger"}) ${(Math.min(1, Math.abs(v) / 2.5) * 68).toFixed(1)}%, var(--surface))`;
}

function renderGrid() {
  const G = RESEARCH.grid, host = $("#gridHost");
  if (!host) return;
  let rows = G.rows.filter(r => S.gridPos === "ALL" || r.p === S.gridPos);
  const k = S.gridSort;
  rows = rows.slice().sort((a, b) => {
    const av = a.c[k] && a.c[k][0], bv = b.c[k] && b.c[k][0];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    return (av - bv) * S.gridDir;
  });
  host.innerHTML = `
  <div class="tablewrap" style="max-height:70vh;overflow-y:auto">
    <table class="grid-t">
      <thead><tr>
        <th class="l stick">player</th>
        ${G.cols.map((c, i) => `<th data-k="${i}" title="${c.help}${c.flip ? " — lower is better, colours flipped" : ""}"
          aria-sort="${k === i ? (S.gridDir < 0 ? "descending" : "ascending") : "none"}">${c.label}${c.flip ? " ↓" : ""}</th>`).join("")}
      </tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td class="l stick"><span class="pos-pill pos-${r.p}">${r.p}</span>
            <span class="pname">${r.n}</span>
            <span class="psub">${r.t || ""}${r.d ? " · " + r.p + r.d : ""}</span></td>
          ${r.c.map((cv, i) => cv == null
            ? `<td class="num" style="color:var(--muted)">—</td>`
            : `<td class="num" style="background:${gridCell(cv[1], G.cols[i].flip)}"
                 title="${G.cols[i].label} ${cv[0]}, ${cv[1] >= 0 ? "+" : ""}${cv[1]} SD for a ${r.p}"
                 >${G.cols[i].key === "auction" ? "$" : ""}${cv[0].toFixed(G.cols[i].nd)}</td>`).join("")}
        </tr>`).join("")}
      </tbody>
    </table>
  </div>
  <p class="hint" style="margin-top:.5rem">${rows.length} players. Colour is standard deviations from the
    average at that player's own position — teal favourable, rust unfavourable. Three columns are marked ↓
    because the good direction is down, and their colours are flipped to match.</p>`;

  host.querySelectorAll("th[data-k]").forEach(th => {
    th.onclick = () => {
      const i = +th.dataset.k;
      S.gridDir = S.gridSort === i ? -S.gridDir : -1;
      S.gridSort = i;
      renderGrid();
    };
  });
}

/* Greedy label placement: names sit to the right of their dot, and slide down until
   they clear the last label placed nearby. A hairline keeps each name attached to
   the point it belongs to once it has moved. */
function placeLabels(items, x, y) {
  const out = [], GAP = 12.5, REACH = 78;
  items.map(p => ({ p, px: x(p.x), py: y(p.y) }))
       .sort((a, b) => a.py - b.py || a.px - b.px)
       .forEach(({ p, px, py }) => {
         const right = p.x < 26;
         let ty = py + 3.5;
         for (const o of out) {
           if (Math.abs(o.lx - (right ? px + 9 : px - 9)) < REACH && Math.abs(o.ty - ty) < GAP) {
             ty = o.ty + GAP;
           }
         }
         out.push({ text: p.n.split(" ").slice(-1)[0], px, py,
                    lx: right ? px + 9 : px - 9,
                    tx: right ? px + 11 : px - 11,
                    anchor: right ? "start" : "end", ty });
       });
  return out;
}

          fill="var(--muted)" text-anchor="middle">$${v}</text>`).join("")}
        <line x1="${mx}" x2="${mx}" y1="${PT}" y2="${H - PB}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="${PL}" x2="${W - PR}" y1="${my}" y2="${my}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>

        <text x="${W - PR - 6}" y="${H - PB - 6}" font-size="10" font-weight="700" fill="var(--danger)"

        ${pts.map(p => `<circle cx="${x(p.x).toFixed(1)}" cy="${y(p.y).toFixed(1)}"

        ${placeLabels(pts.filter(lab), x, y).map(l => `<text x="${l.tx.toFixed(1)}" y="${l.ty.toFixed(1)}"

function renderMatrix() {
  const el = $("#panel-matrix"), R = RESEARCH, C = R.corr, S2 = R.standouts;
  const dupes = C.dupes.slice().sort((a, b) => Math.abs(b[2]) - Math.abs(a[2])).slice(0, 12);

  const IL = pick("LIFT (retracted)"), IO = pick("LOAD");

      <span style="display:inline-block;height:7px;border-radius:2px;width:${w.toFixed(1)}px;background:var(--${col})"></span></span>`;
  };

  el.innerHTML = `
  <div class="grid" style="margin-top:1rem">
    <div class="card pad">
      <div class="section-head">
        <h1>Everything against everything</h1>
      </div>
      <p style="max-width:66ch">Every stat in this project was tested on its own. That is not the same as
      testing whether it adds anything the others do not already say. This is all
      ${C.labels.length} of them correlated against each other and against the two things that matter —

      the second one overturned a stat this app used to ship.</p>
    </div>

    <div class="card pad">
      <div class="section-head">
        <h2>The matrix</h2>
        <span class="hint">clustered, so duplicates fall into blocks along the diagonal</span>
      </div>
      ${renderHeatmap()}
    </div>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(330px,1fr))">
      <div class="card pad">
        <div class="section-head"><h2>Question 1 — which stats are the same stat</h2></div>
        <p class="hint" style="margin-bottom:.6rem">${C.dupes.length} pairs correlate at |rho| ≥ 0.85. Anything
          inside a block is a stat wearing a hat: it can be dropped without losing information. This is why the
          rankings table shows five columns and not forty.</p>
        <div class="tablewrap"><table class="plain">
          <thead><tr><th class="l">stat</th><th class="l">is basically</th><th>rho</th></tr></thead>
          <tbody>${dupes.map(([a, b, r]) => `<tr>
            <td>${a}</td><td>${b}</td>
            <td class="num" style="color:var(--${r >= 0 ? "accent" : "danger"});font-weight:650">${r >= 0 ? "+" : ""}${fmt(r, 3)}</td>
          </tr>`).join("")}</tbody>
        </table></div>
      </div>

      <div class="card pad">
        <div class="section-head"><h2>Question 2 — what is independent of price</h2></div>
        <p class="hint" style="margin-bottom:.6rem">A stat correlated with what a player costs is already in the
          price; you are paying for it. The left bar is how much of the stat the price already contains. The
          right bar is what it knows about the board's <em>miss</em> — the only column that can win you money.</p>
        <div class="tablewrap"><table class="plain">
          <thead><tr><th class="l">stat</th><th>in the price</th><th>knows the miss</th></tr></thead>
          <tbody>
            ${newInfo.map(r => `<tr>
              <td><strong>${r.stat}</strong> <span class="flag good">new information</span></td>
              <td class="num">${bar(r.vs_price, 1, "muted")} ${r.vs_price >= 0 ? "+" : ""}${fmt(r.vs_price, 3)}</td>
              <td class="num" style="color:var(--accent);font-weight:650">${bar(r.vs_miss, .25, "accent")} ${r.vs_miss >= 0 ? "+" : ""}${fmt(r.vs_miss, 3)}</td>
            </tr>`).join("")}
            ${priced.map(r => `<tr>
              <td style="color:var(--muted)">${r.stat}</td>
              <td class="num" style="color:var(--muted)">${bar(r.vs_price, 1, "muted")} ${r.vs_price >= 0 ? "+" : ""}${fmt(r.vs_price, 3)}</td>
              <td class="num" style="color:var(--${r.vs_miss >= 0 ? "accent" : "danger"})">${bar(r.vs_miss, .25, r.vs_miss >= 0 ? "accent" : "danger")} ${r.vs_miss >= 0 ? "+" : ""}${fmt(r.vs_miss, 3)}</td>
            </tr>`).join("")}
          </tbody>
        </table></div>
        <p class="hint" style="margin-top:.6rem">Read the bottom six together: everything the board prices heavily
          predicts its own miss <em>negatively</em>. That is regression to the mean — expensive players
          disappoint, as a class. <strong>LOAD is the single exception</strong>, and that is the whole reason it
          survives.</p>
      </div>
    </div>

    <div class="card pad">
      <div class="section-head">
        <h2>The trap this matrix caught</h2>
        <span class="hint">why "independent of price" is the wrong screen on its own</span>
      </div>
      <div class="findings">
        <div class="finding" style="border-top-color:var(--danger)">
          <p class="eyebrow" style="color:var(--danger)">What the screen said</p>
          <p>LIFT looked ideal: <span class="mono">${fmt(IL.vs_price, 3)}</span> against board value, meaning
          almost none of it was in the price, and <span class="mono">+${fmt(IL.vs_miss, 3)}</span> against the
          miss. On this table it was the best combination on the board, and it is why it shipped.</p>
        </div>
        <div class="finding">
          <p class="eyebrow">What the control said</p>
          <p>But "uncorrelated with price" and "adds something at a given price" are different claims. Rank on
          <em>price alone</em> and you already collect +17 points, because projections overshoot at the top.
          Compare players who cost the same and LIFT's edge falls to
          +${fmt(R.load.lift_spread, 1)} points (t ${fmt(R.load.lift_t, 1)}).</p>
        </div>
        <div class="finding" style="border-top-color:var(--accent)">
          <p class="eyebrow" style="color:var(--accent)">What replaced it</p>
          <p>LOAD is <span class="mono">+${fmt(IO.vs_price, 3)}</span> correlated with price — the naive screen would have thrown
          it straight out. Yet at a fixed price it is worth <strong>+${fmt(R.load.spread)} points</strong>
          (t ${fmt(R.load.t, 1)}). The right question was never "is it in the price", it was "does it beat the
          price".</p>
        </div>
      </div>
    </div>

    <div class="card pad">
      <div class="section-head">
        <h2>Who stands out</h2>
        <span class="hint">${S2.scatter.length} priced players, price against the size of the job</span>
      </div>
      ${renderScatter()}
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:1.2rem">
        ${Object.entries(S2.corners).map(([name, c], k) => `<div>
          <p class="eyebrow" style="margin-bottom:.25rem;color:var(--${k ? "danger" : "accent"})">${name}</p>
          <p class="hint" style="margin-bottom:.5rem">${c.blurb}</p>
          ${c.players.map(p => `<div class="slot">
            <span class="lab">${p.pos}</span>
            <span style="flex:1">${p.name} <span class="psub">${p.team || ""} · $${p.auc}</span></span>
            <span class="mono" style="font-weight:700;color:var(--${k ? "danger" : "accent"})">${fmt(p.load)}</span>
            <span class="psub mono" style="min-width:9em;text-align:right">${fmt(p.role, 1)} + ${fmt(p.prev, 1)}/gm</span>
          </div>`).join("")}
        </div>`).join("")}
      </div>
      <p class="hint" style="margin-top:.8rem;max-width:72ch">Neither list is an instruction. The left column is
        where the validated edge lives, so those are the players to be willing to go a dollar or two over on. The
        right column is not a fade list — several are excellent players — it says the price is carried by scoring
        rather than by volume, and volume is the half that repeats.</p>
      <details class="method">
        <summary>How the corners are drawn, and what they are worth</summary>
        <div class="pad">Both axes are standardised inside position, so a tight end and a quarterback sit on the
        same chart without one drowning the other. The corner statistic is a single gap,
        <span class="mono">z(LOAD) &minus; z(price)</span>, and it is the only one of four candidates that
        survived the price control: cheap-role, cheap-workload and cheap-upside all collapsed toward the null
        once players of equal cost were compared. Scored on
        ${R.load.n} player-seasons across ${R.load.seasons[0]}–${R.load.seasons[R.load.seasons.length - 1]},
        the top third of this gap beat the bottom third by +${fmt(R.load.spread)} points
        (±${fmt(R.load.se, 1)}) inside price bands, against a null of
        ${R.load.null_price >= 0 ? "+" : ""}${fmt(R.load.null_price, 1)} for price on its own. Four seasons is
        the whole depth-chart record, so this is the least-tested number in the app — treat it as a tiebreaker,
        not a mandate.</div>
      </details>
    </div>

    <div class="card pad">
      <div class="section-head">
        <h2>Every player, every column</h2>
        <span class="hint">click a heading to sort — the fastest way to find a lopsided profile</span>
      </div>
      <p style="max-width:70ch">The heatmap above asks how the <em>stats</em> relate to each other. This asks it
      one level down: given those stats, which <em>players</em> disagree with themselves. Every cell is scored
      against others at that player's own position.</p>
      <p style="max-width:70ch">The columns are held to this tab's own standard — no two may correlate above the
      0.85 that defines a duplicate up there. The check is an assertion in the build, and it fired twice while
      this was being written: <em>touches</em> turned out to be the same column as <em>prior use</em> for every
      non-quarterback, and <em>role</em> ran 0.888 against prior use. Both were cut. The closest surviving pair
      is ${R.grid.max_pair[0]} against ${R.grid.max_pair[1]} at ${fmt(R.grid.max_pair[2], 3)}. Price is exempt:
      it is the benchmark the other columns are read against, not a rival signal.</p>
      <div class="chips" style="margin:.7rem 0 .8rem">
        ${["ALL", "QB", "RB", "WR", "TE"].map(p =>
          `<button class="chip" data-gpos="${p}" aria-pressed="${S.gridPos === p}">${p}</button>`).join("")}
      </div>
      <div id="gridHost"></div>
      <p class="hint" style="margin-top:.7rem;max-width:72ch"><strong>One caution.</strong> Only the LOAD column
      carries an edge that survived a price control (+${fmt(R.load.spread)} points at a fixed price). The rest are
      descriptive: they tell you what you are buying and where a profile is strange, not that strange is
      profitable. Sorting this grid will always surface someone — that is what sorting does. Treat a cell that
      disagrees with the price as a question to ask, not an answer.</p>
    </div>
  </div>`;

  el.querySelectorAll("[data-gpos]").forEach(btn => {
    btn.onclick = () => { S.gridPos = btn.dataset.gpos; renderMatrix(); };
  });
  renderGrid();

  const svg = $("#hmSvg"), read = $("#hmRead");
  if (svg) {
    const L = C.labels, M = C.matrix;
    svg.addEventListener("mousemove", e => {
      const t = e.target;
      if (!t.dataset || t.dataset.i === undefined) return;
      const i = +t.dataset.i, j = +t.dataset.j, r = M[i][j];
      read.textContent = i === j ? `${L[i]} — itself` :
        `${L[i]}  ×  ${L[j]}   rho ${r >= 0 ? "+" : ""}${r.toFixed(3)}`;
    });
    svg.addEventListener("mouseleave", () => { read.textContent = "Hover any square to read the pair."; });
  }
}

/* ==================================================================
   BOOT
   ================================================================== */
function render() {
  $("#tab-board").setAttribute("aria-selected", S.tab === "board");
  $("#tab-draft").setAttribute("aria-selected", S.tab === "draft");
  $("#tab-leap").setAttribute("aria-selected", S.tab === "leap");
  $("#tab-matrix").setAttribute("aria-selected", S.tab === "matrix");
  $("#panel-board").hidden = S.tab !== "board";
  $("#panel-draft").hidden = S.tab !== "draft";
  $("#panel-leap").hidden = S.tab !== "leap";
  $("#panel-matrix").hidden = S.tab !== "matrix";
  if (S.tab === "board") renderBoard();
  else if (S.tab === "draft") renderDraft();
  else if (S.tab === "leap") renderLeap();
  else renderMatrix();
}
$("#tab-board").onclick = () => { S.tab = "board"; S.focusSearch = false; render(); };
$("#tab-draft").onclick = () => { S.tab = "draft"; S.focusSearch = true; render(); };
$("#tab-leap").onclick = () => { S.tab = "leap"; S.focusSearch = false; render(); };
$("#tab-matrix").onclick = () => { S.tab = "matrix"; S.focusSearch = false; render(); };
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme;
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
};
load();
render();
</script>

</body>
</html>
