<title>Gridiron Moneyball</title>
<style>
/* ============================================================ tokens
   Light is the base palette; dark redefines only the tokens, guarded so an
   explicit choice beats the OS setting in both directions. */
:root {
  --ground:      #E7ECE9;
  --surface:     #FBFDFC;
  --surface-2:   #F1F5F3;
  --line:        #D2DBD7;
  --line-soft:   #E1E8E5;
  --ink:         #0C1A17;
  --ink-2:       #3A4B45;

  --rb:   #A8532A;

  --te:   #7A4C9E;

    --surface-2:   #16241F;
    --line:        #263531;
    --line-soft:   #1C2A26;
    --ink:         #E3EBE7;
    --ink-2:       #B4C3BD;

    --gold:        #E5B455;
    --gold-soft:   #33280F;
    --danger:      #E4816B;
    --danger-soft: #3A1D16;
    --qb:   #46C4AC;
    --rb:   #E09468;
    --wr:   #74A8E8;
    --te:   #BC96DF;
    --k:    #9AAAA3;
    --dst:  #86AD8F;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}

  --ground:      #0A1311;
  --surface:     #111D1A;
  --surface-2:   #16241F;
  --line:        #263531;
  --line-soft:   #1C2A26;
  --ink:         #E3EBE7;
  --ink-2:       #B4C3BD;
  --muted:       #7E8F88;
  --accent:      #46C4AC;
  --accent-soft: #10312C;
  --gold:        #E5B455;
  --gold-soft:   #33280F;
  --danger:      #E4816B;
  --danger-soft: #3A1D16;
  --qb:   #46C4AC;
  --rb:   #E09468;
  --wr:   #74A8E8;
  --te:   #BC96DF;

* { box-sizing: border-box; }

  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

  font-variant-numeric: tabular-nums;
}

}

/* ============================================================ chrome */
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 clamp(.75rem, 2vw, 1.5rem) 4rem; }
header.top {
  position: sticky; top: 0; z-index: 40;

}

}
.brand { display: flex; align-items: baseline; gap: .55rem; margin-right: auto; }
.brand .name { font-weight: 800; letter-spacing: -.03em; font-size: 1.05rem; }

}

  outline: 2px solid var(--accent); outline-offset: 2px;
}

  border: 1px solid var(--line); border-radius: 7px; padding: .35rem .7rem;
}

/* ============================================================ generic */

  background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow);
}
.pad { padding: 1rem 1.1rem; }

.pos-pill {
  display: inline-block; min-width: 2.4em; text-align: center;
  font-size: .68rem; font-weight: 800; letter-spacing: .04em;
  padding: .12rem .34rem; border-radius: 4px; color: #fff;
}
.pos-QB { background: var(--qb); } .pos-RB { background: var(--rb); }
.pos-WR { background: var(--wr); } .pos-TE { background: var(--te); }
.pos-K  { background: var(--k); }  .pos-DST { background: var(--dst); }

.flag {
  display: inline-block; font-size: .66rem; font-weight: 650; padding: .08rem .34rem;
  border-radius: 4px; margin-right: .25rem; white-space: nowrap;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--line-soft);
}

/* ============================================================ table */
.tablewrap { overflow-x: auto; border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: .86rem; }
thead th {

  border-bottom: 1px solid var(--line); cursor: pointer; user-select: none;
}
thead th:first-child, thead th.l { text-align: left; }
thead th[aria-sort]:not([aria-sort="none"]) { color: var(--accent); }
tbody td { padding: .42rem .55rem; text-align: right; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
tbody td.l { text-align: left; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.gone { opacity: .38; }
tbody tr.mine { background: color-mix(in srgb, var(--accent-soft) 60%, transparent); }
.tier-stripe { display: inline-block; width: 3px; height: 1.1em; border-radius: 2px; vertical-align: -.2em; margin-right: .45rem; }
.pname { font-weight: 620; }
.psub { font-size: .72rem; color: var(--muted); font-weight: 500; }

.vbar { display: inline-block; height: 6px; border-radius: 3px; background: var(--accent); opacity: .8; vertical-align: middle; }

/* ============================================================ draft room */
.room { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr) minmax(0,.95fr); gap: 1rem; align-items: start; }
@media (max-width: 1100px) { .room { grid-template-columns: 1fr; } }
.statline { display: flex; gap: 1.4rem; flex-wrap: wrap; align-items: baseline; }
.stat .k { font-size: .66rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.stat .v { font-size: 1.35rem; font-weight: 750; letter-spacing: -.02em; }
.stat .v.sm { font-size: 1rem; }

.rec { display: flex; gap: .7rem; align-items: flex-start; padding: .6rem .7rem; border-radius: 9px; border: 1px solid var(--line-soft); }
.rec + .rec { margin-top: .45rem; }
.rec.top { border-color: var(--accent); background: var(--accent-soft); }
.rec .n { font-weight: 800; color: var(--muted); font-size: .8rem; min-width: 1.1em; }
.rec .body { flex: 1; min-width: 0; }

.rec .act { display: flex; gap: .3rem; }
.mini {
  font: inherit; font-size: .7rem; font-weight: 700; cursor: pointer; border-radius: 6px;
  padding: .22rem .45rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
}
.mini.pick { background: var(--accent); border-color: var(--accent); color: #fff; }
.mini:hover { filter: brightness(1.06); }

.slots { display: grid; gap: .28rem; }

.slot .lab { font-size: .66rem; font-weight: 800; letter-spacing: .06em; color: var(--muted); min-width: 3.2em; }
.slot.empty { border: 1px dashed var(--line); background: transparent; color: var(--muted); }

.search { display: flex; gap: .4rem; }
.search input {
  flex: 1; min-width: 0; font: inherit; font-size: .9rem; padding: .45rem .6rem;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}

label.cfg { font-size: .72rem; color: var(--muted); font-weight: 650; display: inline-flex; gap: .35rem; align-items: center; }

.log { max-height: 260px; overflow-y: auto; font-size: .78rem; }
.log div { display: flex; gap: .5rem; padding: .18rem 0; border-bottom: 1px solid var(--line-soft); }

.chips { display: flex; gap: .3rem; flex-wrap: wrap; }
.chip {

  border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* ============================================================ findings */
.findings { display: grid; gap: 1.4rem 1.6rem; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); align-items: start; }
.finding { border-top: 2px solid var(--line); padding-top: .7rem; }
.finding h3 { margin-bottom: .3rem; }
.finding p { font-size: .84rem; color: var(--ink-2); margin-bottom: .4rem; }

.kv dt { color: var(--muted); }

.bignum.good { color: var(--accent); } .bignum.bad { color: var(--danger); }
figure { margin: 0; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="top">
  <div class="topbar">
    <div class="brand">
      <span class="name">Gridiron Moneyball</span>
      <span class="sub">2QB PPR &middot; 12 teams</span>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-board" aria-selected="true" aria-controls="panel-board">Rankings</button>
      <button role="tab" id="tab-draft" aria-selected="false" aria-controls="panel-draft">Draft Room</button>
    </div>
    <button class="ghost" id="themeBtn" title="Toggle light / dark">Theme</button>
  </div>
</header>

<div class="wrap">
  <section id="panel-board" role="tabpanel" aria-labelledby="tab-board"></section>
  <section id="panel-draft" role="tabpanel" aria-labelledby="tab-draft" hidden></section>
</div>

<script>
/* ==================================================================
   DATA  (injected at build time)
   ================================================================== */
const DATA = /*__DATA__*/null;
const RESEARCH = /*__RESEARCH__*/null;

const LINEUP = { QB: 2, RB: 2, WR: 3, TE: 1, FLEX: 1, DST: 1, K: 1 };
const FLEX_POS = ["RB", "WR", "TE"];
const BENCH = 6;
const ROSTER_SIZE = 17;
const CAPS = { QB: 4, RB: 6, WR: 7, TE: 3, K: 1, DST: 1 };
/* tuned on 2014-2020, validated on 2021-2025 */
const NEED_BONUS = 70;
const VONA_W = 0.5;

const $ = (s, r) => (r || document).querySelector(s);
const fmt = (n, d) => (n == null || isNaN(n)) ? "—" : Number(n).toFixed(d == null ? 0 : d);

/* ==================================================================
   STATE
   ================================================================== */
const S = {
  tab: "board",
  teams: 12,
  slot: 1,
  picks: [],            // {id, by} where by = team number, 0-indexed team = slot-1 is me
  boardFilter: "ALL",
  boardQuery: "",
  sortKey: "vorp",
  sortDir: -1,
  hideDrafted: true
};
const KEY = "gridiron-moneyball-v1";
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ teams: S.teams, slot: S.slot, picks: S.picks })); } catch (e) {}
}
function load() {
  try {
    const r = JSON.parse(localStorage.getItem(KEY) || "null");
    if (r) { S.teams = r.teams || 12; S.slot = r.slot || 1; S.picks = r.picks || []; }
  } catch (e) {}
}

const byId = new Map(DATA.players.map(p => [p.id, p]));
const takenIds = () => new Set(S.picks.map(p => p.id));

/* ==================================================================
   DRAFT MATH
   ================================================================== */
function teamOnClock(pickNo, teams) {          // 1-indexed pick -> 1-indexed team
  const rd = Math.ceil(pickNo / teams);
  const i = ((pickNo - 1) % teams) + 1;
  return rd % 2 === 1 ? i : teams - i + 1;
}
function myPickNumbers(teams, slot, rounds) {
  const out = [];
  for (let p = 1; p <= teams * rounds; p++) if (teamOnClock(p, teams) === slot) out.push(p);
  return out;
}
function currentPick() { return S.picks.length + 1; }
function nextMyPick(from) {
  const total = S.teams * ROSTER_SIZE;
  for (let p = from; p <= total; p++) if (teamOnClock(p, S.teams) === S.slot) return p;
  return null;
}

function myRoster() { return S.picks.filter(p => p.by === S.slot).map(p => byId.get(p.id)).filter(Boolean); }

function rosterCounts(players) {
  const c = { QB: 0, RB: 0, WR: 0, TE: 0, K: 0, DST: 0 };
  players.forEach(p => { if (c[p.pos] != null) c[p.pos]++; });
  return c;
}

/* Which starting slots are still open, accounting for the flex. */
function openSlots(players) {
  const c = rosterCounts(players);
  const need = {};
  ["QB", "RB", "WR", "TE", "K", "DST"].forEach(p => need[p] = Math.max(0, LINEUP[p] - c[p]));
  let surplus = 0;
  FLEX_POS.forEach(p => surplus += Math.max(0, c[p] - LINEUP[p]));
  need.FLEX = Math.max(0, LINEUP.FLEX - surplus);
  return need;
}

function available() {
  const t = takenIds();
  return DATA.players.filter(p => !t.has(p.id));
}

/* Value over next available: what the position costs you if you wait a turn. */
function vonaGains(avail, picksUntilNext) {
  const sorted = [...avail].sort((a, b) => b.vorp - a.vorp);
  const survivors = new Set(sorted.slice(picksUntilNext).map(p => p.id));
  const g = {};
  ["QB", "RB", "WR", "TE", "K", "DST"].forEach(pos => {
    const now = sorted.find(p => p.pos === pos);
    const later = sorted.find(p => p.pos === pos && survivors.has(p.id));
    g[pos] = (now ? now.vorp : 0) - (later ? later.vorp : (now ? now.vorp : 0));
  });
  return g;
}

/* The formula. Returns scored, sorted candidates with a plain-English reason. */
function recommend(limit) {
  const avail = available();
  const roster = myRoster();
  const counts = rosterCounts(roster);
  const need = openSlots(roster);
  const cur = currentPick();
  const nxt = nextMyPick(cur + 1);
  const picksUntil = nxt ? nxt - cur - 1 : 0;
  const gains = vonaGains(avail, picksUntil);
  const picksLeft = ROSTER_SIZE - roster.length;
  const mustFill = Object.entries(need).filter(([k, v]) => k !== "FLEX" && v > 0)
                         .reduce((a, [, v]) => a + v, 0) + need.FLEX;

  const scored = avail.map(p => {
    let sc = p.vorp;
    const why = [];
    const fillsStarter = need[p.pos] > 0;
    const fillsFlex = !fillsStarter && need.FLEX > 0 && FLEX_POS.includes(p.pos);
    if (fillsStarter) { sc += NEED_BONUS; why.push("fills your " + p.pos + " slot"); }
    else if (fillsFlex) { sc += NEED_BONUS * 0.6; why.push("fills your flex"); }
    const g = gains[p.pos] || 0;
    if (g > 0) { sc += VONA_W * g; }
    if (g >= 25) why.push("the " + p.pos + " board drops " + fmt(g) + " pts before your next pick");

    // roster caps and end-of-draft realities
    if (counts[p.pos] >= (CAPS[p.pos] || 99)) sc = -1e6;
    if ((p.pos === "K" || p.pos === "DST") && picksLeft > 2) sc -= 400;
    if (mustFill >= picksLeft && !(fillsStarter || fillsFlex)) sc = -1e6;

    if (p.flags && p.flags.includes("TD regression risk")) why.push("scored above his volume last year — expect a pullback");
    if (p.flags && p.flags.includes("Positive TD regression")) why.push("underscored his volume last year — buy-low");
    if (p.tier === 1 && p.pos !== "K" && p.pos !== "DST") why.push("top tier at " + p.pos);
    return { p, sc, why, g };
  }).filter(x => x.sc > -1e5);

  scored.sort((a, b) => b.sc - a.sc);

  // Tier-cliff note. Only worth saying when the tier was a real group to begin
  // with — a tier of one is just a gap, not a run about to end.
  scored.slice(0, limit || 6).forEach(x => {
    if (x.p.pos === "K" || x.p.pos === "DST") return;
    const tierSize = DATA.players.filter(q => q.pos === x.p.pos && q.tier === x.p.tier).length;
    const left = avail.filter(q => q.pos === x.p.pos && q.tier === x.p.tier).length;
    if (tierSize >= 2 && left === 1) x.why.unshift("last man in " + x.p.pos + " tier " + x.p.tier);
  });
  return scored.slice(0, limit || 6);
}

function positionalRun() {
  const last = S.picks.slice(-8);
  if (last.length < 5) return null;
  const c = {};
  last.forEach(p => { const q = byId.get(p.id); if (q) c[q.pos] = (c[q.pos] || 0) + 1; });
  const best = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
  return best && best[1] >= 4 ? { pos: best[0], n: best[1], of: last.length } : null;
}

/* ==================================================================
   ACTIONS
   ================================================================== */
function draftPlayer(id, mine) {
  const pickNo = currentPick();
  const by = mine ? S.slot : teamOnClock(pickNo, S.teams);
  if (mine && by !== S.slot) {
    // user is claiming a pick out of turn: advance to their slot is wrong, so
    // record it as theirs anyway and let the pick counter stay truthful
  }
  S.picks.push({ id, by: mine ? S.slot : teamOnClock(pickNo, S.teams) });
  save(); render();
}
function undo() { S.picks.pop(); save(); render(); }
function resetDraft() { S.picks = []; save(); render(); }

/* ==================================================================
   RENDER — BOARD
   ================================================================== */
const COLS = [
  { k: "rank", t: "#", cls: "num", w: p => p.rank },
  { k: "name", t: "Player", cls: "l", w: p => p.name },
  { k: "pos", t: "Pos", cls: "l", w: p => p.pos },
  { k: "team", t: "Tm", cls: "l", w: p => p.team || "" },
  { k: "bye", t: "Bye", cls: "num", w: p => p.bye },
  { k: "age", t: "Age", cls: "num", w: p => p.age },
  { k: "ppg", t: "Proj PPG", cls: "num", w: p => p.ppg },
  { k: "g", t: "Gm", cls: "num", w: p => p.g },
  { k: "pts", t: "Proj Pts", cls: "num", w: p => p.pts },
  { k: "vorp", t: "VORP", cls: "num", w: p => p.vorp },
  { k: "tier", t: "Tier", cls: "num", w: p => p.tier },
  { k: "auc", t: "$", cls: "num", w: p => p.auc }
];

function renderBoard() {
  const el = $("#panel-board");
  const t = takenIds();
  let rows = DATA.players.filter(p =>
    (S.boardFilter === "ALL" || p.pos === S.boardFilter) &&
    (!S.boardQuery || p.name.toLowerCase().includes(S.boardQuery.toLowerCase()) ||
      (p.team || "").toLowerCase().includes(S.boardQuery.toLowerCase())));
  const col = COLS.find(c => c.k === S.sortKey) || COLS[9];
  rows.sort((a, b) => {
    const x = col.w(a), y = col.w(b);
    if (typeof x === "string" || typeof y === "string") return String(x).localeCompare(String(y)) * S.sortDir * -1;
    return ((x == null ? -1e9 : x) - (y == null ? -1e9 : y)) * S.sortDir;
  });
  const maxV = Math.max(...DATA.players.map(p => p.vorp));

  el.innerHTML = `
  <div class="grid" style="padding-top:1.1rem">
    <div>
      <p class="eyebrow">The board</p>

        Ranked by value over replacement for <strong>this</strong> lineup — 2QB, 2RB, 3WR, 1TE, 1 flex, 12 teams, full PPR.

      ${renderVorpChart()}
      <details class="method">
        <summary>How the projections are built</summary>

          <p><strong>Data.</strong> nflverse play-by-play aggregates, 1999–2025: ${DATA.meta.player_seasons.toLocaleString()} scored
          player-seasons plus team defense and kicking. Targets and air yards only exist from 2009, so anything
          target-based trains on 2009+.</p>
          <p><strong>Projection.</strong> One gradient-boosted model per position predicts next-season points per game,
          a second predicts games played; season value is their product. Features are usage (carries, targets, target
          share, air-yards share, first downs), efficiency (EPA, CPOE, YAC, aDOT), age, experience, and two years of lags.
          The published number blends that model 75/25 with last season's actual points, which beat either alone in a
          15-season backtest.</p>
          <p><strong>Rookies</strong> get the historical average for their draft-capital bucket — no scouting, just what
          rookies taken in that range have actually done since 2006. <strong>Kickers and defenses</strong> are regressed
          most of the way to the league mean because that is all the year-over-year signal there is.</p>
          <p><strong>Value.</strong> Replacement level is computed by filling every starting slot in a 12-team league of
          this shape — including the flex — and reading off the first player who does not start. VORP is projected points
          above that line.</p>
          <p><strong>Honest limits.</strong> No injury reports, depth charts, holdouts, suspensions, or coaching changes
          are in here. A player who changed teams is projected on his old team's usage. Treat this as the price sheet,
          not the last word — if you know something the box score does not, override it.</p>
        </div>
      </details>
    </div>

    <div class="card">
      <div class="pad" style="display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)">
        <div class="chips">
          ${["ALL", "QB", "RB", "WR", "TE", "K", "DST"].map(p =>
            `<button class="chip" data-filter="${p}" aria-pressed="${S.boardFilter === p}">${p}</button>`).join("")}
        </div>

      <div class="tablewrap">

          <thead><tr>${COLS.map(c =>
            `<th class="${c.cls === 'l' ? 'l' : ''}" data-sort="${c.k}"

            <th class="l">Notes</th></tr></thead>
          <tbody>
            ${rows.slice(0, 400).map(p => `
              <tr class="${t.has(p.id) ? 'gone' : ''}">

                  <span class="tier-stripe" style="background:var(--${p.pos.toLowerCase()})"></span>
                  <span class="pname">${p.name}</span>

                </td>

                <td class="l">${p.team || "—"}</td>

                <td class="l">${(p.flags || []).map(f => `<span class="flag ${flagClass(f)}">${f}</span>`).join("")}</td>
              </tr>`).join("")}

  el.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { S.boardFilter = b.dataset.filter; render(); });

  if (bs) bs.oninput = () => { S.boardQuery = bs.value; const p = bs.selectionStart; render(); const n = $("#boardSearch"); n.focus(); n.setSelectionRange(p, p); };
}

function flagClass(f) {
  if (/regression risk|cliff|decline|Injury/.test(f)) return "warn";
  if (/Positive/.test(f)) return "good";
  if (/Rookie/.test(f)) return "gold";
  return "";
}

function renderVorpChart() {
  const C = RESEARCH.curve, N = 36;
  const W = 720, H = 260, PL = 44, PR = 12, PT = 16, PB = 30;
  const all = ["QB", "RB", "WR", "TE"].flatMap(p => C[p].slice(0, N));
  const lo = Math.min(...all), hi = Math.max(...all);
  const x = i => PL + (i / (N - 1)) * (W - PL - PR);
  const y = v => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);
  const line = p => C[p].slice(0, N).map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const ticks = [0, 50, 100, 150, 200].filter(v => v >= lo && v <= hi);
  return `
  <figure style="margin-top:1.1rem">
    <div class="tablewrap">
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block" role="img"
           aria-label="Value over replacement by positional rank, 2015 to 2025 average">
        ${ticks.map(v => `<line x1="${PL}" x2="${W - PR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
          <text x="${PL - 8}" y="${y(v) + 4}" font-size="10" fill="var(--muted)" text-anchor="end">${v}</text>`).join("")}
        <line x1="${PL}" x2="${W - PR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/>
        ${[1, 6, 12, 18, 24, 30, 36].map(r => `<text x="${x(r - 1)}" y="${H - 10}" font-size="10" fill="var(--muted)" text-anchor="middle">${r}</text>`).join("")}
        ${["QB", "RB", "WR", "TE"].map(p =>
          `<path d="${line(p)}" fill="none" stroke="var(--${p.toLowerCase()})" stroke-width="2.4" stroke-linejoin="round"/>`).join("")}
        ${["QB", "RB", "WR", "TE"].map((p, i) =>
          `<g transform="translate(${W - PR - 190 + i * 48},${PT + 4})">
             <rect width="10" height="3" y="4" fill="var(--${p.toLowerCase()})"/>
             <text x="14" y="9" font-size="11" fill="var(--ink-2)">${p}</text></g>`).join("")}
      </svg>
    </div>
    <figcaption>Points above replacement by rank at each position, averaged 2015–2025 under this exact lineup.
      The dashed line is replacement level — below it, a player is free on waivers.</figcaption>
  </figure>`;
}

function renderRoster(roster, need) {
  const used = new Set();
  const rows = [];
  const take = pos => {
    const c = roster.filter(p => p.pos === pos && !used.has(p.id))
                    .sort((a, b) => b.pts - a.pts)[0];
    if (c) used.add(c.id);
    return c;
  };
  const push = (lab, p) => rows.push(`<div class="slot ${p ? "" : "empty"}">
      <span class="lab">${lab}</span>
      ${p ? `<span style="flex:1">${p.name} <span class="psub">${p.team || ""}${p.bye ? " · bye " + p.bye : ""}</span></span>
             <span class="mono psub">${fmt(p.pts)}</span>`
          : `<span style="flex:1">— open —</span>`}
    </div>`);
  for (let i = 0; i < LINEUP.QB; i++) push("QB", take("QB"));
  for (let i = 0; i < LINEUP.RB; i++) push("RB", take("RB"));
  for (let i = 0; i < LINEUP.WR; i++) push("WR", take("WR"));
  push("TE", take("TE"));
  const flex = roster.filter(p => FLEX_POS.includes(p.pos) && !used.has(p.id)).sort((a, b) => b.pts - a.pts)[0];
  if (flex) used.add(flex.id);
  push("FLEX", flex);
  push("DST", take("DST"));
  push("K", take("K"));
  const bench = roster.filter(p => !used.has(p.id)).sort((a, b) => b.pts - a.pts);
  const starters = roster.filter(p => used.has(p.id));
  const projPts = starters.reduce((a, p) => a + p.pts, 0);

  // bye-week collisions among starters
  const byes = {};
  starters.forEach(p => { if (p.bye) (byes[p.bye] = byes[p.bye] || []).push(p); });
  const clashes = Object.entries(byes).filter(([, v]) => v.length >= 3);

  return `
    <div class="slots">${rows.join("")}</div>
    <div style="margin-top:.8rem;display:flex;gap:1.2rem;flex-wrap:wrap">
      <div class="stat"><div class="k">Projected starter points</div><div class="v mono sm">${fmt(projPts)}</div></div>
      <div class="stat"><div class="k">Slots open</div><div class="v mono sm">${Object.values(need).reduce((a, b) => a + b, 0)}</div></div>
    </div>
    ${clashes.length ? `<p class="hint" style="margin-top:.6rem"><span class="flag warn">Bye stack</span>
      ${clashes.map(([w, v]) => `${v.length} starters off in week ${w}`).join("; ")}.</p>` : ""}
    ${bench.length ? `<div style="margin-top:.9rem">
      <p class="eyebrow" style="margin-bottom:.35rem">Bench (${bench.length}/${BENCH})</p>
      <div class="slots">${bench.map(p => `<div class="slot">
        <span class="lab">${p.pos}</span><span style="flex:1">${p.name}</span>
        <span class="mono psub">${fmt(p.pts)}</span></div>`).join("")}</div></div>` : ""}`;
}

    box.innerHTML = m.length ? m.map(p => `
      <div class="rec">
        <div class="body">
          <div><span class="pos-pill pos-${p.pos}">${p.pos}</span> <strong>${p.name}</strong>
            <span class="psub">${p.team || ""} · ${fmt(p.pts)} pts · VORP ${fmt(p.vorp)}</span></div>
        </div>
        <div class="act">
          <button class="mini pick" data-take="${p.id}">Mine</button>
          <button class="mini" data-gone="${p.id}">Gone</button>
        </div>
      </div>`).join("") : (inp.value.trim() ? `<p class="hint">Nobody left by that name.</p>` : "");
    box.querySelectorAll("[data-take]").forEach(b => b.onclick = () => draftPlayer(b.dataset.take, true));
    box.querySelectorAll("[data-gone]").forEach(b => b.onclick = () => draftPlayer(b.dataset.gone, false));
  };
  inp.oninput = paint;
  inp.onkeydown = e => {
    if (e.key !== "Enter") return;
    const m = matches();
    if (!m.length) return;
    e.preventDefault();
    draftPlayer(m[0].id, e.shiftKey);
  };
  paint();
  if (document.activeElement !== inp && S.focusSearch) { inp.focus(); }
}

/* ==================================================================
   BOOT
   ================================================================== */
function render() {
  $("#tab-board").setAttribute("aria-selected", S.tab === "board");
  $("#tab-draft").setAttribute("aria-selected", S.tab === "draft");
  $("#panel-board").hidden = S.tab !== "board";
  $("#panel-draft").hidden = S.tab !== "draft";
  if (S.tab === "board") renderBoard(); else renderDraft();
}
$("#tab-board").onclick = () => { S.tab = "board"; S.focusSearch = false; render(); };
$("#tab-draft").onclick = () => { S.tab = "draft"; S.focusSearch = true; render(); };
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme;
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
};
load();
render();
</script>
