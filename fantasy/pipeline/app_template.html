<style>

<script>
/* ==================================================================
   DATA  (injected at build time)
   ================================================================== */
const DATA = /*__DATA__*/null;
const RESEARCH = /*__RESEARCH__*/null;

const LINEUP = { QB: 2, RB: 2, WR: 3, TE: 1, FLEX: 1, DST: 1, K: 1 };
const FLEX_POS = ["RB", "WR", "TE"];
const BENCH = 6;
const ROSTER_SIZE = 17;
const CAPS = { QB: 4, RB: 6, WR: 7, TE: 3, K: 1, DST: 1 };

const $ = (s, r) => (r || document).querySelector(s);
const fmt = (n, d) => (n == null || isNaN(n)) ? "—" : Number(n).toFixed(d == null ? 0 : d);

/* ==================================================================
   STATE
   ================================================================== */
const S = {
  tab: "board",
  teams: 10,
  budget: 200,
  sales: [],            // {id, price, mine}
  boardFilter: "ALL",
  boardQuery: "",
  sortKey: "auc",
  sortDir: -1,
  gridPos: "ALL",
  gridSort: 0,
  gridDir: -1
};
const KEY = "gridiron-moneyball-auction-v1";
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(
      { teams: S.teams, budget: S.budget, sales: S.sales }));
  } catch (e) {}
}
function load() {
  try {
    const r = JSON.parse(localStorage.getItem(KEY) || "null");
    if (r) { S.teams = r.teams || 10; S.budget = r.budget || 200; S.sales = r.sales || []; }
  } catch (e) {}
}

const byId = new Map(DATA.players.map(p => [p.id, p]));
const soldIds = () => new Set(S.sales.map(s => s.id));
const available = () => { const t = soldIds(); return DATA.players.filter(p => !t.has(p.id)); };

/* ==================================================================
   AUCTION MATH

   Every dollar in the room is chasing the value still on the board. When the
   early lots go cheap, the leftover money has to land somewhere, so the price
   of everyone still available rises. That ratio is the inflation factor, and
   it is the single most useful number in a live auction.
   ================================================================== */
function myRoster() { return S.sales.filter(s => s.mine).map(s => byId.get(s.id)).filter(Boolean); }
function mySpent() { return S.sales.filter(s => s.mine).reduce((a, s) => a + s.price, 0); }

function budgetState() {
  const roster = myRoster();
  const spent = mySpent();
  const left = S.budget - spent;
  const spots = ROSTER_SIZE - roster.length;
  return {
    roster, spent, left, spots,
    maxBid: Math.max(0, left - Math.max(0, spots - 1)),
    perSpot: spots > 0 ? left / spots : 0
  };
}

function leagueState() {
  const totalMoney = S.teams * S.budget;
  const spentAll = S.sales.reduce((a, s) => a + s.price, 0);
  const moneyLeft = totalMoney - spentAll;
  const spotsLeft = S.teams * ROSTER_SIZE - S.sales.length;
  const discretionary = Math.max(0, moneyLeft - spotsLeft);   // $1 reserved per spot
  // value still on the board, counted over as many players as there are seats
  const av = available().slice().sort((a, b) => b.auc - a.auc).slice(0, Math.max(0, spotsLeft));
  const valueLeft = av.reduce((a, p) => a + Math.max(0, p.auc - 1), 0);
  const inflation = valueLeft > 0 ? discretionary / valueLeft : 1;
  return { totalMoney, spentAll, moneyLeft, spotsLeft, discretionary, valueLeft,
           inflation: Math.max(0.3, Math.min(3, inflation)) };
}

/* What this room is doing to each position, versus the board.

   A fixed rule cannot know your league. A premium that pays when two managers
   use it stops paying when six do, so the only durable version of "buy low" is
   measured live: track what each position has actually sold for against list,
   and lean toward whatever is going cheap. */
function posMarket(pos, L) {
  L = L || leagueState();
  let paid = 0, list = 0, n = 0;
  S.sales.forEach(s => {
    const p = byId.get(s.id);
    if (!p || p.pos !== pos) return;
    paid += s.price; list += Math.max(1, p.auc); n++;
  });
  const live = (n > 0 && list > 0) ? paid / list : null;

  // Your own league's 2025 sheet is a far better starting guess than "assume the
  // room is rational". Shrink from that prior toward what is happening tonight as
  // the sales pile up — eight sales at a position and the live read has the floor.
  const prior = (RESEARCH.room && RESEARCH.room.ratio) ? RESEARCH.room.ratio[pos] : null;
  let ratio;
  if (live == null) ratio = prior;
  else if (prior == null) ratio = live;
  else { const w = n / (n + 8); ratio = w * live + (1 - w) * prior; }
  if (ratio == null) return { n, ratio: null, live, prior, lean: 1 };

  // lean the other way, gently, and never by more than 15%
  const lean = Math.max(0.85, Math.min(1.15, 1 + (1 - ratio) * 0.5));
  return { n, ratio, live, prior, lean };
}

/* Market price after inflation — what this player should go for right now. */
function adjPrice(p, L) {
  return Math.max(1, Math.round(1 + Math.max(0, p.auc - 1) * (L || leagueState()).inflation));
}

/* Roster slots still open, flex included. */
function openSlots(players) {
  const c = { QB: 0, RB: 0, WR: 0, TE: 0, K: 0, DST: 0 };
  players.forEach(p => { if (c[p.pos] != null) c[p.pos]++; });
  const need = {};
  ["QB", "RB", "WR", "TE", "K", "DST"].forEach(p => need[p] = Math.max(0, LINEUP[p] - c[p]));
  let surplus = 0;
  FLEX_POS.forEach(p => surplus += Math.max(0, c[p] - LINEUP[p]));
  need.FLEX = Math.max(0, LINEUP.FLEX - surplus);
  need._counts = c;
  return need;
}

/* What YOU should be willing to pay. Two forces: the market price after
   inflation, and your own budget pressure — money you do not spend is money
   you never had. */
function myMax(p, B, L) {
  B = B || budgetState(); L = L || leagueState();
  if (B.spots <= 0) return 0;
  const need = openSlots(B.roster);
  if ((need._counts[p.pos] || 0) >= (CAPS[p.pos] || 99)) return 0;

  const market = adjPrice(p, L);
  // my own money-to-value ratio over the seats I still have to fill
  const myDisc = Math.max(0, B.left - B.spots);
  const wants = available().filter(q => q.id !== p.id)
    .sort((a, b) => b.auc - a.auc).slice(0, Math.max(0, B.spots - 1));
  const wantValue = wants.reduce((a, q) => a + Math.max(0, q.auc - 1), 0)
                  + Math.max(0, p.auc - 1);
  const personal = wantValue > 0 ? myDisc / wantValue : 1;

  let bid = 1 + Math.max(0, p.auc - 1) * Math.max(L.inflation, personal);

  // No fixed positional premium. Every one tested — quarterback, receiver,
  // volatility — either lost outright against ordinary value bidders or only
  // paid while few others were doing it. What replaces it is the live read on
  // what THIS room is actually underpaying for.
  bid *= posMarket(p.pos, L).lean;

  // a slot you still have to fill is worth more than a bench upgrade
  const fills = need[p.pos] > 0 || (need.FLEX > 0 && FLEX_POS.includes(p.pos));
  if (fills) bid *= 1.08;
  else if (p.pos !== "K" && p.pos !== "DST") bid *= 0.92;

  // kicker and defense are coin flips; never pay for them
  if (p.pos === "K" || p.pos === "DST") bid = Math.min(bid, 2);

  // Never bid money — or a roster spot — you need to finish a legal lineup.
  // K and D/ST are mandatory slots even though they are worth a dollar each.
  const mustFill = Object.entries(need).filter(([k]) => k !== "_counts" && k !== "FLEX")
    .reduce((a, [, v]) => a + v, 0) + need.FLEX;
  const fillsAny = fills || need[p.pos] > 0;
  if (!fillsAny && mustFill >= B.spots) return 0;
  const reserve = Math.max(0, mustFill - (fillsAny ? 1 : 0));
  return Math.max(0, Math.min(Math.round(bid), B.maxBid, B.left - reserve));
}

function verdict(p, B, L) {
  const mx = myMax(p, B, L);
  const mkt = adjPrice(p, L);
  const need = openSlots(B.roster);
  if (B.spots <= 0) return { mx, mkt, tone: "warn", text: "Your roster is full." };
  if ((need._counts[p.pos] || 0) >= (CAPS[p.pos] || 99))
    return { mx, mkt, tone: "warn", text: "You already have as many " + p.pos + "s as you can use." };
  if (mx < 1) return { mx, mkt, tone: "warn", text: "You cannot afford him and still fill your roster." };
  if (mx >= mkt) return { mx, mkt, tone: "good",
    text: "Bid to $" + mx + ". Market is about $" + mkt + ", and you can afford to win this one." };
  return { mx, mkt, tone: "", text: "Bid to $" + mx + " and no further — he should go for about $" + mkt + "." };
}

/* The board, re-sorted by what is worth chasing given your budget right now. */
function targets(limit) {
  const B = budgetState(), L = leagueState();
  const need = openSlots(B.roster);
  // once your remaining spots only just cover the slots you must still fill,
  // kicker and defense stop being ignorable and start being the whole list
  const mustFill = Object.entries(need).filter(([k]) => k !== "_counts" && k !== "FLEX")
    .reduce((a, [, v]) => a + v, 0) + need.FLEX;
  const mustOnly = mustFill >= B.spots;
  return available().map(p => {
    const mx = myMax(p, B, L);
    const mkt = adjPrice(p, L);
    const fills = need[p.pos] > 0 || (need.FLEX > 0 && FLEX_POS.includes(p.pos));
    const why = [];
    if (fills) why.push("fills your " + (need[p.pos] > 0 ? p.pos : "flex") + " slot");
    if (mx > mkt) why.push("you can outbid the room's likely price of $" + mkt);
    if (p.flags && p.flags.includes("TD regression risk")) why.push("scored above his volume last year — expect a pullback");
    if (p.flags && p.flags.includes("Positive TD regression")) why.push("underscored his volume last year — buy-low");
    // value per dollar you can actually spend, weighted toward slots you need
    const score = mx < 1 ? -1 : (p.vorp + (fills ? 25 : 0)) / Math.max(mkt, 1);
    return { p, mx, mkt, why, score, affordable: mx >= mkt };
  }).filter(x => x.score > 0 && (mustOnly || (x.p.pos !== "K" && x.p.pos !== "DST")))
    .sort((a, b) => b.score - a.score)
    // no more than two of any position, or a 2QB league returns nothing but
    // quarterbacks and the list stops being a shopping list
    .filter((x, _i, all) => all.filter(y => y.p.pos === x.p.pos).indexOf(x) < 2)
    .slice(0, limit || 8);
}

function priceCheck() {
  /* How the room has been paying versus the board, so far. */
  if (!S.sales.length) return null;
  let paid = 0, list = 0;
  S.sales.forEach(s => { const p = byId.get(s.id); if (p) { paid += s.price; list += Math.max(1, p.auc); } });
  return list > 0 ? paid / list : null;
}

function logSale(id, price, mine) {
  const p = byId.get(id);
  if (!p) return;
  S.sales.push({ id, price: Math.max(1, Math.round(price) || 1), mine: !!mine });
  save(); render();
}
function undo() { S.sales.pop(); save(); render(); }
function resetAuction() { S.sales = []; save(); render(); }

function flagClass(f) {
  if (/regression risk|cliff|decline|Injury/.test(f)) return "warn";
  if (/Positive/.test(f)) return "good";
  if (/Rookie/.test(f)) return "gold";
  return "";
}

    </dl>
  </div>

  <div class="finding">
    <p class="eyebrow">Where the points are</p>
    <p>The shape of each position's value curve is the whole draft strategy. Quarterback is a cliff: QB1 through
    QB12 are worth more than the same ranks at running back, and then it falls off a table. Wide receiver is a
    gentle slope you can ride into the late rounds. Tight end is one elite player and then nothing.</p>
    <dl class="kv">
      <dt>QB12 value over replacement</dt><dd class="num">${fmt(R.curve.QB[11])}</dd>
      <dt>RB12</dt><dd class="num">${fmt(R.curve.RB[11])}</dd>
      <dt>WR12</dt><dd class="num">${fmt(R.curve.WR[11])}</dd>
      <dt>TE12</dt><dd class="num">${fmt(R.curve.TE[11])}</dd>
    </dl>
  </div>`;
}

function renderVorpChart() {
  const C = RESEARCH.curve, N = 36;
  const W = 720, H = 260, PL = 44, PR = 12, PT = 16, PB = 30;
  const all = ["QB", "RB", "WR", "TE"].flatMap(p => C[p].slice(0, N));
  const lo = Math.min(...all), hi = Math.max(...all);
  const x = i => PL + (i / (N - 1)) * (W - PL - PR);
  const y = v => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);
  const line = p => C[p].slice(0, N).map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const ticks = [0, 50, 100, 150, 200].filter(v => v >= lo && v <= hi);
  return `
  <figure style="margin-top:1.1rem">
    <div class="tablewrap">
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block" role="img"
           aria-label="Value over replacement by positional rank, 2015 to 2025 average">
        ${ticks.map(v => `<line x1="${PL}" x2="${W - PR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
          <text x="${PL - 8}" y="${y(v) + 4}" font-size="10" fill="var(--muted)" text-anchor="end">${v}</text>`).join("")}
        <line x1="${PL}" x2="${W - PR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/>
        ${[1, 6, 12, 18, 24, 30, 36].map(r => `<text x="${x(r - 1)}" y="${H - 10}" font-size="10" fill="var(--muted)" text-anchor="middle">${r}</text>`).join("")}
        ${["QB", "RB", "WR", "TE"].map(p =>
          `<path d="${line(p)}" fill="none" stroke="var(--${p.toLowerCase()})" stroke-width="2.4" stroke-linejoin="round"/>`).join("")}
        ${["QB", "RB", "WR", "TE"].map((p, i) =>
          `<g transform="translate(${W - PR - 190 + i * 48},${PT + 4})">
             <rect width="10" height="3" y="4" fill="var(--${p.toLowerCase()})"/>
             <text x="14" y="9" font-size="11" fill="var(--ink-2)">${p}</text></g>`).join("")}
      </svg>
    </div>
    <figcaption>Points above replacement by rank at each position, averaged 2015–2025 under this exact lineup.
      The dashed line is replacement level — below it, a player is free on waivers.</figcaption>
  </figure>`;
}

function renderRoster(B, need, L) {
  const used = new Set();
  const priceOf = id => { const s = S.sales.find(x => x.id === id && x.mine); return s ? s.price : 0; };
  const rows = [];
  const take = pos => {
    const c = B.roster.filter(p => p.pos === pos && !used.has(p.id)).sort((a, b) => b.pts - a.pts)[0];
    if (c) used.add(c.id);
    return c;
  };
  const push = (lab, p) => rows.push(`<div class="slot ${p ? "" : "empty"}">
      <span class="lab">${lab}</span>
      ${p ? `<span style="flex:1">${p.name} <span class="psub">${p.team || ""}${p.bye ? " · bye " + p.bye : ""}</span></span>
             <span class="mono psub">$${priceOf(p.id)}</span>`
          : `<span style="flex:1">— open —</span>`}
    </div>`);
  for (let i = 0; i < LINEUP.QB; i++) push("QB", take("QB"));
  for (let i = 0; i < LINEUP.RB; i++) push("RB", take("RB"));
  for (let i = 0; i < LINEUP.WR; i++) push("WR", take("WR"));
  push("TE", take("TE"));
  const flex = B.roster.filter(p => FLEX_POS.includes(p.pos) && !used.has(p.id)).sort((a, b) => b.pts - a.pts)[0];
  if (flex) used.add(flex.id);
  push("FLEX", flex);
  push("DST", take("DST"));
  push("K", take("K"));
  const bench = B.roster.filter(p => !used.has(p.id)).sort((a, b) => b.pts - a.pts);
  const starters = B.roster.filter(p => used.has(p.id));
  const projPts = starters.reduce((a, p) => a + p.pts, 0);

  // where the money went, against where the board says it should go
  const spentBy = {};
  S.sales.filter(x => x.mine).forEach(x => {
    const p = byId.get(x.id); if (p) spentBy[p.pos] = (spentBy[p.pos] || 0) + x.price;
  });
  const target = RESEARCH.budget_split || {};

  const byes = {};
  starters.forEach(p => { if (p.bye) (byes[p.bye] = byes[p.bye] || []).push(p); });
  const clashes = Object.entries(byes).filter(([, v]) => v.length >= 3);

  const pct = B.spent / S.budget * 100;
  return `
    <div class="slots">${rows.join("")}</div>
    <div style="margin-top:.9rem">
      <div style="height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden">
        <div style="height:100%;width:${Math.min(100, pct)}%;background:var(--accent)"></div>
      </div>
      <p class="hint" style="margin:.3rem 0 0">$${fmt(B.spent)} of $${fmt(S.budget)} spent · ${B.roster.length}/${ROSTER_SIZE} rostered</p>
    </div>
    <div style="margin-top:.7rem;display:flex;gap:1.2rem;flex-wrap:wrap">
      <div class="stat"><div class="k">Projected starter points</div><div class="v mono sm">${fmt(projPts)}</div></div>
      <div class="stat"><div class="k">Slots open</div>
        <div class="v mono sm">${Object.entries(need).filter(([k]) => k !== "_counts").reduce((a, [, v]) => a + v, 0)}</div></div>
    </div>
    ${Object.keys(spentBy).length ? `
      <div style="margin-top:.8rem">
        <p class="eyebrow" style="margin-bottom:.35rem">Where your money went</p>
        <dl class="kv">${["QB", "RB", "WR", "TE"].filter(p => spentBy[p] || target[p]).map(p =>
          `<dt>${p}</dt><dd class="num">$${fmt(spentBy[p] || 0)}${target[p] ? ` <span class="psub">of ~$${fmt(target[p] / 100 * S.budget)}</span>` : ""}</dd>`).join("")}</dl>
      </div>` : ""}
    ${clashes.length ? `<p class="hint" style="margin-top:.6rem"><span class="flag warn">Bye stack</span>
      ${clashes.map(([w, v]) => `${v.length} starters off in week ${w}`).join("; ")}.</p>` : ""}
    ${bench.length ? `<div style="margin-top:.9rem">
      <p class="eyebrow" style="margin-bottom:.35rem">Bench (${bench.length}/${BENCH})</p>
      <div class="slots">${bench.map(p => `<div class="slot">
        <span class="lab">${p.pos}</span><span style="flex:1">${p.name}</span>
        <span class="mono psub">$${priceOf(p.id)}</span></div>`).join("")}</div></div>` : ""}`;
}

function matchPlayers(q) {
  q = (q || "").trim().toLowerCase();
  if (!q) return [];
  return available().filter(p => p.name.toLowerCase().includes(q)).slice(0, 6);
}

function wireLog() {
  const inp = $("#logSearch"), price = $("#logPrice"), box = $("#logResult");
  if (!inp) return;
  const paint = () => {
    const m = matchPlayers(inp.value);
    box.innerHTML = m.length ? m.map(p => `
      <div class="rec">
        <div class="body"><div><span class="pos-pill pos-${p.pos}">${p.pos}</span> <strong>${p.name}</strong>
          <span class="psub">${p.team || ""} · list $${p.auc}</span></div></div>
        <div class="act">
          <button class="mini pick" data-w="${p.id}">I won</button>
          <button class="mini" data-s="${p.id}">Sold</button>
        </div>
      </div>`).join("") : (inp.value.trim() ? `<p class="hint">Nobody left by that name.</p>` : "");
    const grab = id => {
      const v = +price.value;
      if (!v || v < 1) { price.focus(); return null; }
      return v;
    };
    box.querySelectorAll("[data-w]").forEach(b => b.onclick = () => {
      const v = grab(); if (v) { logSale(b.dataset.w, v, true); }
    });
    box.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
      const v = grab(); if (v) { logSale(b.dataset.s, v, false); }
    });
  };
  inp.oninput = paint;
  inp.onkeydown = e => {
    if (e.key !== "Enter") return;
    const m = matchPlayers(inp.value);
    const v = +price.value;
    if (!m.length || !v || v < 1) return;
    e.preventDefault();
    logSale(m[0].id, v, e.shiftKey);
  };
  paint();
}

/* ==================================================================

const HM = { cell: 21, gutL: 186, gutT: 150 };

function hmColor(r) {
  const a = Math.min(1, Math.abs(r)) * 100;
  return `color-mix(in srgb, var(--${r >= 0 ? "accent" : "danger"}) ${a.toFixed(1)}%, var(--surface))`;
}

function renderHeatmap() {
  const L = RESEARCH.corr.labels, M = RESEARCH.corr.matrix, n = L.length;
  const { cell, gutL, gutT } = HM;
  const W = gutL + n * cell + 8, H = gutT + n * cell + 8;
  const cells = [];
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const r = M[i][j];
      cells.push(`<rect data-i="${i}" data-j="${j}" x="${gutL + j * cell}" y="${gutT + i * cell}"
        width="${cell}" height="${cell}" fill="${i === j ? "var(--ink-2)" : hmColor(r)}"/>`);
    }
  }
  return `
  <figure style="margin:0">
    <div class="tablewrap" style="border:1px solid var(--line-soft);background:var(--surface)">
      <svg id="hmSvg" viewBox="0 0 ${W} ${H}" width="${W}" style="display:block;max-width:none"
           role="img" aria-label="Correlation matrix of ${n} fantasy football metrics, hierarchically clustered">
        ${cells.join("")}
        ${L.map((l, i) => `<text x="${gutL - 8}" y="${gutT + i * cell + cell / 2 + 4}" font-size="11.5"
          text-anchor="end" fill="var(--ink-2)">${l}</text>`).join("")}
        ${L.map((l, j) => `<text transform="translate(${gutL + j * cell + cell / 2 + 4},${gutT - 8}) rotate(-52)"
          font-size="11.5" text-anchor="start" fill="var(--ink-2)">${l}</text>`).join("")}
        <rect x="${gutL}" y="${gutT}" width="${n * cell}" height="${n * cell}"
              fill="none" stroke="var(--line)" stroke-width="1"/>
      </svg>
    </div>
    <div id="hmRead" class="mono" style="margin-top:.5rem;font-size:.8rem;color:var(--ink-2);min-height:1.3em">
      Hover any square to read the pair.
    </div>
    <figcaption>Spearman rank correlation between every pair of ${n} metrics, over
      ${RESEARCH.corr.n_rows || "12,000+"} player-seasons. Rows and columns are ordered by hierarchical
      clustering on 1&nbsp;&minus;&nbsp;|rho|, so metrics that say the same thing sit in blocks along the
      diagonal. Teal is positive, rust negative, intensity is strength.</figcaption>
  </figure>`;
}

/* ---------------------------------------------------------------- player grid */
function gridCell(z, flip) {
  if (z == null) return "transparent";
  const v = flip ? -z : z;
  return `color-mix(in srgb, var(--${v >= 0 ? "accent" : "danger"}) ${(Math.min(1, Math.abs(v) / 2.5) * 68).toFixed(1)}%, var(--surface))`;
}

function renderGrid() {
  const G = RESEARCH.grid, host = $("#gridHost");
  if (!host) return;
  let rows = G.rows.filter(r => S.gridPos === "ALL" || r.p === S.gridPos);
  const k = S.gridSort;
  rows = rows.slice().sort((a, b) => {
    const av = a.c[k] && a.c[k][0], bv = b.c[k] && b.c[k][0];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    return (av - bv) * S.gridDir;
  });
  host.innerHTML = `
  <div class="tablewrap" style="max-height:70vh;overflow-y:auto">
    <table class="grid-t">
      <thead><tr>
        <th class="l stick">player</th>
        ${G.cols.map((c, i) => `<th data-k="${i}" title="${c.help}${c.flip ? " — lower is better, colours flipped" : ""}"
          aria-sort="${k === i ? (S.gridDir < 0 ? "descending" : "ascending") : "none"}">${c.label}${c.flip ? " ↓" : ""}</th>`).join("")}
      </tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td class="l stick"><span class="pos-pill pos-${r.p}">${r.p}</span>
            <span class="pname">${r.n}</span>
            <span class="psub">${r.t || ""}${r.d ? " · " + r.p + r.d : ""}</span></td>
          ${r.c.map((cv, i) => cv == null
            ? `<td class="num" style="color:var(--muted)">—</td>`
            : `<td class="num" style="background:${gridCell(cv[1], G.cols[i].flip)}"
                 title="${G.cols[i].label} ${cv[0]}, ${cv[1] >= 0 ? "+" : ""}${cv[1]} SD for a ${r.p}"
                 >${G.cols[i].key === "auction" ? "$" : ""}${cv[0].toFixed(G.cols[i].nd)}</td>`).join("")}
        </tr>`).join("")}
      </tbody>
    </table>
  </div>
  <p class="hint" style="margin-top:.5rem">${rows.length} players. Colour is standard deviations from the
    average at that player's own position — teal favourable, rust unfavourable. Three columns are marked ↓
    because the good direction is down, and their colours are flipped to match.</p>`;

  host.querySelectorAll("th[data-k]").forEach(th => {
    th.onclick = () => {
      const i = +th.dataset.k;
      S.gridDir = S.gridSort === i ? -S.gridDir : -1;
      S.gridSort = i;
      renderGrid();
    };
  });
}

/* Greedy label placement: names sit to the right of their dot, and slide down until
   they clear the last label placed nearby. A hairline keeps each name attached to
   the point it belongs to once it has moved. */
function placeLabels(items, x, y) {
  const out = [], GAP = 12.5, REACH = 78;
  items.map(p => ({ p, px: x(p.x), py: y(p.y) }))
       .sort((a, b) => a.py - b.py || a.px - b.px)
       .forEach(({ p, px, py }) => {
         const right = p.x < 26;
         let ty = py + 3.5;
         for (const o of out) {
           if (Math.abs(o.lx - (right ? px + 9 : px - 9)) < REACH && Math.abs(o.ty - ty) < GAP) {
             ty = o.ty + GAP;
           }
         }
         out.push({ text: p.n.split(" ").slice(-1)[0], px, py,
                    lx: right ? px + 9 : px - 9,
                    tx: right ? px + 11 : px - 11,
                    anchor: right ? "start" : "end", ty });
       });
  return out;
}

          fill="var(--muted)" text-anchor="middle">$${v}</text>`).join("")}
        <line x1="${mx}" x2="${mx}" y1="${PT}" y2="${H - PB}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="${PL}" x2="${W - PR}" y1="${my}" y2="${my}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>

        <text x="${W - PR - 6}" y="${H - PB - 6}" font-size="10" font-weight="700" fill="var(--danger)"

        ${pts.map(p => `<circle cx="${x(p.x).toFixed(1)}" cy="${y(p.y).toFixed(1)}"

        ${placeLabels(pts.filter(lab), x, y).map(l => `<text x="${l.tx.toFixed(1)}" y="${l.ty.toFixed(1)}"

function renderMatrix() {
  const el = $("#panel-matrix"), R = RESEARCH, C = R.corr, S2 = R.standouts;
  const dupes = C.dupes.slice().sort((a, b) => Math.abs(b[2]) - Math.abs(a[2])).slice(0, 12);

  const IL = pick("LIFT (retracted)"), IO = pick("LOAD");

      <span style="display:inline-block;height:7px;border-radius:2px;width:${w.toFixed(1)}px;background:var(--${col})"></span></span>`;
  };

  el.innerHTML = `
  <div class="grid" style="margin-top:1rem">
    <div class="card pad">
      <div class="section-head">
        <h1>Everything against everything</h1>
      </div>
      <p style="max-width:66ch">Every stat in this project was tested on its own. That is not the same as
      testing whether it adds anything the others do not already say. This is all
      ${C.labels.length} of them correlated against each other and against the two things that matter —

      the second one overturned a stat this app used to ship.</p>
    </div>

    <div class="card pad">
      <div class="section-head">
        <h2>The matrix</h2>
        <span class="hint">clustered, so duplicates fall into blocks along the diagonal</span>
      </div>
      ${renderHeatmap()}
    </div>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(330px,1fr))">
      <div class="card pad">
        <div class="section-head"><h2>Question 1 — which stats are the same stat</h2></div>
        <p class="hint" style="margin-bottom:.6rem">${C.dupes.length} pairs correlate at |rho| ≥ 0.85. Anything
          inside a block is a stat wearing a hat: it can be dropped without losing information. This is why the
          rankings table shows five columns and not forty.</p>
        <div class="tablewrap"><table class="plain">
          <thead><tr><th class="l">stat</th><th class="l">is basically</th><th>rho</th></tr></thead>
          <tbody>${dupes.map(([a, b, r]) => `<tr>
            <td>${a}</td><td>${b}</td>
            <td class="num" style="color:var(--${r >= 0 ? "accent" : "danger"});font-weight:650">${r >= 0 ? "+" : ""}${fmt(r, 3)}</td>
          </tr>`).join("")}</tbody>
        </table></div>
      </div>

      <div class="card pad">
        <div class="section-head"><h2>Question 2 — what is independent of price</h2></div>
        <p class="hint" style="margin-bottom:.6rem">A stat correlated with what a player costs is already in the
          price; you are paying for it. The left bar is how much of the stat the price already contains. The
          right bar is what it knows about the board's <em>miss</em> — the only column that can win you money.</p>
        <div class="tablewrap"><table class="plain">
          <thead><tr><th class="l">stat</th><th>in the price</th><th>knows the miss</th></tr></thead>
          <tbody>
            ${newInfo.map(r => `<tr>
              <td><strong>${r.stat}</strong> <span class="flag good">new information</span></td>
              <td class="num">${bar(r.vs_price, 1, "muted")} ${r.vs_price >= 0 ? "+" : ""}${fmt(r.vs_price, 3)}</td>
              <td class="num" style="color:var(--accent);font-weight:650">${bar(r.vs_miss, .25, "accent")} ${r.vs_miss >= 0 ? "+" : ""}${fmt(r.vs_miss, 3)}</td>
            </tr>`).join("")}
            ${priced.map(r => `<tr>
              <td style="color:var(--muted)">${r.stat}</td>
              <td class="num" style="color:var(--muted)">${bar(r.vs_price, 1, "muted")} ${r.vs_price >= 0 ? "+" : ""}${fmt(r.vs_price, 3)}</td>
              <td class="num" style="color:var(--${r.vs_miss >= 0 ? "accent" : "danger"})">${bar(r.vs_miss, .25, r.vs_miss >= 0 ? "accent" : "danger")} ${r.vs_miss >= 0 ? "+" : ""}${fmt(r.vs_miss, 3)}</td>
            </tr>`).join("")}
          </tbody>
        </table></div>
        <p class="hint" style="margin-top:.6rem">Read the bottom six together: everything the board prices heavily
          predicts its own miss <em>negatively</em>. That is regression to the mean — expensive players
          disappoint, as a class. <strong>LOAD is the single exception</strong>, and that is the whole reason it
          survives.</p>
      </div>
    </div>

    <div class="card pad">
      <div class="section-head">
        <h2>The trap this matrix caught</h2>
        <span class="hint">why "independent of price" is the wrong screen on its own</span>
      </div>
      <div class="findings">
        <div class="finding" style="border-top-color:var(--danger)">
          <p class="eyebrow" style="color:var(--danger)">What the screen said</p>
          <p>LIFT looked ideal: <span class="mono">${fmt(IL.vs_price, 3)}</span> against board value, meaning
          almost none of it was in the price, and <span class="mono">+${fmt(IL.vs_miss, 3)}</span> against the
          miss. On this table it was the best combination on the board, and it is why it shipped.</p>
        </div>
        <div class="finding">
          <p class="eyebrow">What the control said</p>
          <p>But "uncorrelated with price" and "adds something at a given price" are different claims. Rank on
          <em>price alone</em> and you already collect +17 points, because projections overshoot at the top.
          Compare players who cost the same and LIFT's edge falls to
          +${fmt(R.load.lift_spread, 1)} points (t ${fmt(R.load.lift_t, 1)}).</p>
        </div>
        <div class="finding" style="border-top-color:var(--accent)">
          <p class="eyebrow" style="color:var(--accent)">What replaced it</p>
          <p>LOAD is <span class="mono">+${fmt(IO.vs_price, 3)}</span> correlated with price — the naive screen would have thrown
          it straight out. Yet at a fixed price it is worth <strong>+${fmt(R.load.spread)} points</strong>
          (t ${fmt(R.load.t, 1)}). The right question was never "is it in the price", it was "does it beat the
          price".</p>
        </div>
      </div>
    </div>

    <div class="card pad">
      <div class="section-head">
        <h2>Who stands out</h2>
        <span class="hint">${S2.scatter.length} priced players, price against the size of the job</span>
      </div>
      ${renderScatter()}
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:1.2rem">
        ${Object.entries(S2.corners).map(([name, c], k) => `<div>
          <p class="eyebrow" style="margin-bottom:.25rem;color:var(--${k ? "danger" : "accent"})">${name}</p>
          <p class="hint" style="margin-bottom:.5rem">${c.blurb}</p>
          ${c.players.map(p => `<div class="slot">
            <span class="lab">${p.pos}</span>
            <span style="flex:1">${p.name} <span class="psub">${p.team || ""} · $${p.auc}</span></span>
            <span class="mono" style="font-weight:700;color:var(--${k ? "danger" : "accent"})">${fmt(p.load)}</span>
            <span class="psub mono" style="min-width:9em;text-align:right">${fmt(p.role, 1)} + ${fmt(p.prev, 1)}/gm</span>
          </div>`).join("")}
        </div>`).join("")}
      </div>
      <p class="hint" style="margin-top:.8rem;max-width:72ch">Neither list is an instruction. The left column is
        where the validated edge lives, so those are the players to be willing to go a dollar or two over on. The
        right column is not a fade list — several are excellent players — it says the price is carried by scoring
        rather than by volume, and volume is the half that repeats.</p>
      <details class="method">
        <summary>How the corners are drawn, and what they are worth</summary>
        <div class="pad">Both axes are standardised inside position, so a tight end and a quarterback sit on the
        same chart without one drowning the other. The corner statistic is a single gap,
        <span class="mono">z(LOAD) &minus; z(price)</span>, and it is the only one of four candidates that
        survived the price control: cheap-role, cheap-workload and cheap-upside all collapsed toward the null
        once players of equal cost were compared. Scored on
        ${R.load.n} player-seasons across ${R.load.seasons[0]}–${R.load.seasons[R.load.seasons.length - 1]},
        the top third of this gap beat the bottom third by +${fmt(R.load.spread)} points
        (±${fmt(R.load.se, 1)}) inside price bands, against a null of
        ${R.load.null_price >= 0 ? "+" : ""}${fmt(R.load.null_price, 1)} for price on its own. Four seasons is
        the whole depth-chart record, so this is the least-tested number in the app — treat it as a tiebreaker,
        not a mandate.</div>
      </details>
    </div>

    <div class="card pad">
      <div class="section-head">
        <h2>Every player, every column</h2>
        <span class="hint">click a heading to sort — the fastest way to find a lopsided profile</span>
      </div>
      <p style="max-width:70ch">The heatmap above asks how the <em>stats</em> relate to each other. This asks it
      one level down: given those stats, which <em>players</em> disagree with themselves. Every cell is scored
      against others at that player's own position.</p>
      <p style="max-width:70ch">The columns are held to this tab's own standard — no two may correlate above the
      0.85 that defines a duplicate up there. The check is an assertion in the build, and it fired twice while
      this was being written: <em>touches</em> turned out to be the same column as <em>prior use</em> for every
      non-quarterback, and <em>role</em> ran 0.888 against prior use. Both were cut. The closest surviving pair
      is ${R.grid.max_pair[0]} against ${R.grid.max_pair[1]} at ${fmt(R.grid.max_pair[2], 3)}. Price is exempt:
      it is the benchmark the other columns are read against, not a rival signal.</p>
      <div class="chips" style="margin:.7rem 0 .8rem">
        ${["ALL", "QB", "RB", "WR", "TE"].map(p =>
          `<button class="chip" data-gpos="${p}" aria-pressed="${S.gridPos === p}">${p}</button>`).join("")}
      </div>
      <div id="gridHost"></div>
      <p class="hint" style="margin-top:.7rem;max-width:72ch"><strong>One caution.</strong> Only the LOAD column
      carries an edge that survived a price control (+${fmt(R.load.spread)} points at a fixed price). The rest are
      descriptive: they tell you what you are buying and where a profile is strange, not that strange is
      profitable. Sorting this grid will always surface someone — that is what sorting does. Treat a cell that
      disagrees with the price as a question to ask, not an answer.</p>
    </div>
  </div>`;

  el.querySelectorAll("[data-gpos]").forEach(btn => {
    btn.onclick = () => { S.gridPos = btn.dataset.gpos; renderMatrix(); };
  });
  renderGrid();

  const svg = $("#hmSvg"), read = $("#hmRead");
  if (svg) {
    const L = C.labels, M = C.matrix;
    svg.addEventListener("mousemove", e => {
      const t = e.target;
      if (!t.dataset || t.dataset.i === undefined) return;
      const i = +t.dataset.i, j = +t.dataset.j, r = M[i][j];
      read.textContent = i === j ? `${L[i]} — itself` :
        `${L[i]}  ×  ${L[j]}   rho ${r >= 0 ? "+" : ""}${r.toFixed(3)}`;
    });
    svg.addEventListener("mouseleave", () => { read.textContent = "Hover any square to read the pair."; });
  }
}

/* ==================================================================
   BOOT
   ================================================================== */
function render() {
  $("#tab-board").setAttribute("aria-selected", S.tab === "board");
  $("#tab-draft").setAttribute("aria-selected", S.tab === "draft");
  $("#tab-leap").setAttribute("aria-selected", S.tab === "leap");
  $("#tab-matrix").setAttribute("aria-selected", S.tab === "matrix");
  $("#panel-board").hidden = S.tab !== "board";
  $("#panel-draft").hidden = S.tab !== "draft";
  $("#panel-leap").hidden = S.tab !== "leap";
  $("#panel-matrix").hidden = S.tab !== "matrix";
  if (S.tab === "board") renderBoard();
  else if (S.tab === "draft") renderDraft();
  else if (S.tab === "leap") renderLeap();
  else renderMatrix();
}
$("#tab-board").onclick = () => { S.tab = "board"; S.focusSearch = false; render(); };
$("#tab-draft").onclick = () => { S.tab = "draft"; S.focusSearch = true; render(); };
$("#tab-leap").onclick = () => { S.tab = "leap"; S.focusSearch = false; render(); };
$("#tab-matrix").onclick = () => { S.tab = "matrix"; S.focusSearch = false; render(); };
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme;
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
};
load();
render();
</script>
